<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Banco de Preguntas Temple</title>

  <style>
    :root {
      --azul-oscuro: #2F5573;
      --azul: #4C78A0;
      --azul-medio: #6FA3C8;
      --celeste: #DCECF7;
      --celeste-claro: #F4FAFD;
      --azul-borde: #B8D4E8;
      --texto: #263746;
      --texto-suave: #607789;
      --blanco: #FFFFFF;
      --gris: #F5F7F9;
      --rojo-suave: #FFF3F3;
      --sombra: 0 8px 25px rgba(47, 85, 115, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--celeste-claro);
      color: var(--texto);
    }

    /* ENCABEZADO */

    header {
      background: var(--azul-oscuro);
      color: white;
      padding: 42px 20px 38px;
    }

    .header-inner {
      max-width: 1180px;
      margin: auto;
    }

    .marca {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.85;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.2;
    }

    .subtitulo {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
    }

    /* CONTENEDOR */

    .contenedor {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 50px;
    }

    /* BUSCADOR */

    .buscador {
      background: var(--blanco);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--sombra);
      margin-bottom: 18px;
    }

    .input-busqueda {
      width: 100%;
      padding: 15px 17px;
      border: 1px solid var(--azul-borde);
      border-radius: 11px;
      font-size: 15px;
      color: var(--texto);
      outline: none;
      transition: 0.2s;
    }

    .input-busqueda:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(76, 120, 160, 0.10);
    }

    /* FILTROS */

    .filtros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--azul-borde);
      border-radius: 10px;
      background: white;
      color: var(--texto);
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--azul);
    }

    /* FAVORITOS */

    .barra-favoritos {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .boton-favoritos {
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .boton-favoritos:hover {
      background: var(--celeste);
    }

    .boton-favoritos.activo {
      background: var(--azul-oscuro);
      color: white;
      border-color: var(--azul-oscuro);
    }

    .contador-favoritos {
      font-size: 13px;
      color: var(--texto-suave);
    }

    /* INFORMACIÓN */

    .info-resultados {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 22px 2px 15px;
      color: var(--texto-suave);
      font-size: 14px;
    }

    /* TARJETAS */

    .grid-preguntas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .tarjeta {
      position: relative;
      background: white;
      border: 1px solid #E2EBF1;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(47, 85, 115, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .tarjeta:hover {
      transform: translateY(-2px);
      box-shadow: var(--sombra);
    }

    .numero-pregunta {
      color: var(--azul);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .pregunta-texto {
      font-size: 16px;
      line-height: 1.55;
      margin: 0 42px 18px 0;
      color: var(--texto);
    }

    .estrella-tarjeta {
      position: absolute;
      right: 17px;
      top: 15px;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      font-size: 23px;
      color: #AAB9C4;
      transition: 0.2s;
    }

    .estrella-tarjeta:hover {
      background: var(--celeste-claro);
      transform: scale(1.08);
    }

    .estrella-tarjeta.activa {
      color: #E3A72F;
    }

    .etiquetas {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 17px;
    }

    .etiqueta {
      background: var(--celeste);
      color: var(--azul-oscuro);
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 11px;
      line-height: 1.3;
    }

    .boton-ver {
      width: 100%;
      border: 0;
      background: var(--azul-oscuro);
      color: white;
      padding: 11px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }

    .boton-ver:hover {
      background: var(--azul);
    }

    /* PAGINACIÓN */

    .paginacion {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
    }

    .boton-pagina {
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .boton-pagina:hover:not(:disabled) {
      background: var(--celeste);
    }

    .boton-pagina:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pagina-info {
      font-size: 13px;
      color: var(--texto-suave);
      min-width: 100px;
      text-align: center;
    }

    /* ESTADO VACÍO */

    .sin-resultados {
      background: white;
      border: 1px solid #E2EBF1;
      border-radius: 15px;
      padding: 45px 25px;
      text-align: center;
      color: var(--texto-suave);
      grid-column: 1 / -1;
    }

    .sin-resultados-icono {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .sin-resultados h3 {
      color: var(--texto);
      margin: 0 0 8px;
      font-size: 18px;
    }

    .sin-resultados p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(22, 40, 53, 0.58);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.visible {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-contenido {
      position: relative;
      width: 100%;
      max-width: 650px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.20);
    }

    .cerrar-modal {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 38px;
      height: 38px;
      border: 0;
      background: var(--gris);
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      color: var(--texto);
    }

    .cerrar-modal:hover {
      background: var(--celeste);
    }

    .modal-numero {
      color: var(--azul);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .modal-pregunta {
      font-size: 21px;
      line-height: 1.5;
      color: var(--texto);
      margin: 0 45px 22px 0;
    }

    .modal-datos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .modal-acciones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .accion {
      flex: 1;
      min-width: 180px;
      padding: 12px 15px;
      border-radius: 9px;
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .accion:hover {
      background: var(--celeste-claro);
    }

    .accion-principal {
      background: var(--azul-oscuro);
      color: white;
      border-color: var(--azul-oscuro);
    }

    .accion-principal:hover {
      background: var(--azul);
    }

    .accion-favorito.activa {
      background: #FFF8E8;
      border-color: #E8C56B;
      color: #9A7119;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 20px;
      color: var(--texto-suave);
      font-size: 12px;
    }

    /* RESPONSIVE */

    @media (max-width: 800px) {
      .grid-preguntas {
        grid-template-columns: 1fr;
      }

      .filtros {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;
      }
    }

    @media (max-width: 500px) {
      header {
        padding: 32px 18px;
      }

      .contenedor {
        padding: 20px 14px 40px;
      }

      .modal-contenido {
        padding: 24px 20px;
      }

      .modal-pregunta {
        font-size: 18px;
      }

      .info-resultados {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

    /* =====================================================

    const preguntasPorPagina = 20;

    let paginaActual = 1;
    let resultadosActuales = [];
    let mostrarSoloFavoritas = false;
    let preguntaModalActual = null;

    let favoritos = JSON.parse(
      localStorage.getItem("temple_favoritos") || "[]"
    );

    favoritos = favoritos.map(Number);


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const busqueda = document.getElementById("busqueda");
    const filtroModulo = document.getElementById("filtroModulo");
    const filtroEtapa = document.getElementById("filtroEtapa");
    const filtroSubtema = document.getElementById("filtroSubtema");

    const botonFavoritos = document.getElementById("botonFavoritos");
    const contadorFavoritos = document.getElementById("contadorFavoritos");

    const contadorResultados = document.getElementById("contadorResultados");
    const textoPagina = document.getElementById("textoPagina");

    const listaPreguntas = document.getElementById("listaPreguntas");
    const paginacion = document.getElementById("paginacion");

    const modal = document.getElementById("modal");
    const cerrarModal = document.getElementById("cerrarModal");

    const modalNumero = document.getElementById("modalNumero");
    const modalPregunta = document.getElementById("modalPregunta");
    const modalDatos = document.getElementById("modalDatos");

    const modalFavorito = document.getElementById("modalFavorito");
    const copiarPregunta = document.getElementById("copiarPregunta");


    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escaparHTML(texto) {
      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function esFavorita(id) {
      return favoritos.includes(Number(id));
    }


    function guardarFavoritos() {
      localStorage.setItem(
        "temple_favoritos",
        JSON.stringify(favoritos)
      );
    }


    function actualizarContadorFavoritos() {
      const cantidad = favoritos.length;

      contadorFavoritos.textContent =
        cantidad === 1
          ? "1 favorita"
          : `${cantidad} favoritas`;

      if (mostrarSoloFavoritas) {
        botonFavoritos.textContent =
          cantidad === 1
            ? "★ Mostrando 1 favorita"
            : `★ Mostrando ${cantidad} favoritas`;
      } else {
        botonFavoritos.textContent = "☆ Solo favoritas";
      }

      botonFavoritos.classList.toggle(
        "activo",
        mostrarSoloFavoritas
      );
    }


    /* =====================================================
       FILTROS
       ===================================================== */

    function valoresUnicos(campo) {
      return [...new Set(
        preguntas.map(p => p[campo])
      )].sort();
    }


    function llenarFiltro(select, valores, textoInicial) {

      select.innerHTML =
        `<option value="">${textoInicial}</option>`;

      valores.forEach(valor => {

        const option = document.createElement("option");

        option.value = valor;
        option.textContent = valor;

        select.appendChild(option);

      });
    }


    function prepararFiltros() {

      llenarFiltro(
        filtroModulo,
        valoresUnicos("modulo"),
        "Todos los módulos"
      );

      llenarFiltro(
        filtroEtapa,
        valoresUnicos("etapa"),
        "Todas las etapas"
      );

      llenarFiltro(
        filtroSubtema,
        valoresUnicos("subtema"),
        "Todos los subtemas"
      );
    }


    /* =====================================================
       FILTRADO
       ===================================================== */

    function obtenerResultados() {

      const texto = busqueda.value
        .trim()
        .toLowerCase();

      const modulo = filtroModulo.value;
      const etapa = filtroEtapa.value;
      const subtema = filtroSubtema.value;

      resultadosActuales = preguntas.filter(p => {

        const coincideTexto =
          !texto ||
          p.pregunta.toLowerCase().includes(texto) ||
          p.modulo.toLowerCase().includes(texto) ||
          p.etapa.toLowerCase().includes(texto) ||
          p.subtema.toLowerCase().includes(texto);

        const coincideModulo =
          !modulo || p.modulo === modulo;

        const coincideEtapa =
          !etapa || p.etapa === etapa;

        const coincideSubtema =
          !subtema || p.subtema === subtema;

        const coincideFavorito =
          !mostrarSoloFavoritas || esFavorita(p.id);

        return (
          coincideTexto &&
          coincideModulo &&
          coincideEtapa &&
          coincideSubtema &&
          coincideFavorito
        );

      });

    }


    function actualizarResultados(resetearPagina = true) {

      obtenerResultados();

      if (resetearPagina) {
        paginaActual = 1;
      }

      const totalPaginas =
        Math.max(
          1,
          Math.ceil(
            resultadosActuales.length /
            preguntasPorPagina
          )
        );

      if (paginaActual > totalPaginas) {
        paginaActual = totalPaginas;
      }

      renderizarPreguntas();
      renderizarPaginacion();
      actualizarContadorFavoritos();

    }


    /* =====================================================
       PREGUNTAS
       ===================================================== */

    function renderizarPreguntas() {

      listaPreguntas.innerHTML = "";

      const inicio =
        (paginaActual - 1) *
        preguntasPorPagina;

      const fin =
        inicio + preguntasPorPagina;

      const pagina =
        resultadosActuales.slice(inicio, fin);


      contadorResultados.textContent =
        resultadosActuales.length === 1
          ? "1 pregunta"
          : `${resultadosActuales.length} preguntas`;


      if (resultadosActuales.length === 0) {

        textoPagina.textContent = "";

        listaPreguntas.innerHTML = `
          <div class="sin-resultados">
            <div class="sin-resultados-icono">🔎</div>
            <h3>No encontramos preguntas</h3>
            <p>
              Prueba modificando la búsqueda o alguno de los filtros.
            </p>
          </div>
        `;

        return;
      }


      const totalPaginas =
        Math.ceil(
          resultadosActuales.length /
          preguntasPorPagina
        );

      textoPagina.textContent =
        `Página ${paginaActual} de ${totalPaginas}`;


      pagina.forEach(p => {

        const favorita = esFavorita(p.id);

        const tarjeta =
          document.createElement("article");

        tarjeta.className = "tarjeta";

        tarjeta.innerHTML = `

          <button
            class="estrella-tarjeta ${favorita ? "activa" : ""}"
            type="button"
            aria-label="${favorita ? "Quitar de favoritas" : "Agregar a favoritas"}"
            title="${favorita ? "Quitar de favoritas" : "Agregar a favoritas"}"
            data-id="${p.id}"
          >
            ${favorita ? "★" : "☆"}
          </button>

          <div class="numero-pregunta">
            PREGUNTA ${p.id}
          </div>

          <p class="pregunta-texto">
            ${escaparHTML(p.pregunta)}
          </p>

          <div class="etiquetas">
            <span class="etiqueta">
              ${escaparHTML(p.modulo)}
            </span>

            <span class="etiqueta">
              ${escaparHTML(p.etapa)}
            </span>

            <span class="etiqueta">
              ${escaparHTML(p.subtema)}
            </span>
          </div>

          <button
            class="boton-ver"
            type="button"
            data-id="${p.id}"
          >
            Ver pregunta
          </button>

        `;

        listaPreguntas.appendChild(tarjeta);

      });


      document
        .querySelectorAll(".estrella-tarjeta")
        .forEach(btn => {

          btn.addEventListener(
            "click",
            function(event) {

              event.stopPropagation();

              cambiarFavorito(
                Number(this.dataset.id)
              );

            }
          );

        });


      document
        .querySelectorAll(".boton-ver")
        .forEach(btn => {

          btn.addEventListener(
            "click",
            function() {

              abrirModal(
                Number(this.dataset.id)
              );

            }
          );

        });

    }


    /* =====================================================
       FAVORITOS
       ===================================================== */

    function cambiarFavorito(id) {

      id = Number(id);

      if (esFavorita(id)) {

        favoritos =
          favoritos.filter(
            favorito => favorito !== id
          );

      } else {

        favoritos.push(id);

      }

      guardarFavoritos();

      actualizarResultados(false);

      if (
        preguntaModalActual &&
        Number(preguntaModalActual.id) === id
      ) {
        actualizarModalFavorito();
      }

    }


    botonFavoritos.addEventListener(
      "click",
      function() {

        mostrarSoloFavoritas =
          !mostrarSoloFavoritas;

        paginaActual = 1;

        actualizarResultados(false);

      }
    );


    /* =====================================================
       MODAL
       ===================================================== */

    function abrirModal(id) {

      const pregunta =
        preguntas.find(
          p => Number(p.id) === Number(id)
        );

      if (!pregunta) return;

      preguntaModalActual = pregunta;

      modalNumero.textContent =
        `PREGUNTA ${pregunta.id}`;

      modalPregunta.textContent =
        pregunta.pregunta;

      modalDatos.innerHTML = `

        <span class="etiqueta">
          ${escaparHTML(pregunta.modulo)}
        </span>

        <span class="etiqueta">
          ${escaparHTML(pregunta.etapa)}
        </span>

        <span class="etiqueta">
          ${escaparHTML(pregunta.subtema)}
        </span>

      `;

      actualizarModalFavorito();

      copiarPregunta.textContent =
        "📋 Copiar pregunta";

      modal.classList.add("visible");

      document.body.style.overflow = "hidden";

    }


    function actualizarModalFavorito() {

      if (!preguntaModalActual) return;

      const favorita =
        esFavorita(preguntaModalActual.id);

      if (favorita) {

        modalFavorito.textContent =
          "★ Quitar de favoritas";

      } else {

        modalFavorito.textContent =
          "☆ Agregar a favoritas";

      }

      modalFavorito.classList.toggle(
        "activa",
        favorita
      );

    }


    function cerrarElModal() {

      modal.classList.remove("visible");

      document.body.style.overflow = "";

      preguntaModalActual = null;

    }


    cerrarModal.addEventListener(
      "click",
      cerrarElModal
    );


    modal.addEventListener(
      "click",
      function(event) {

        if (event.target === modal) {
          cerrarElModal();
        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          modal.classList.contains("visible")
        ) {
          cerrarElModal();
        }

      }
    );


    modalFavorito.addEventListener(
      "click",
      function() {

        if (!preguntaModalActual) return;

        cambiarFavorito(
          preguntaModalActual.id
        );

      }
    );


    /* =====================================================
       COPIAR
       ===================================================== */

    copiarPregunta.addEventListener(
      "click",
      async function() {

        if (!preguntaModalActual) return;

        const texto =
          preguntaModalActual.pregunta;

        try {

          await navigator.clipboard.writeText(texto);

          copiarPregunta.textContent =
            "✓ Copiada";

          setTimeout(() => {

            if (modal.classList.contains("visible")) {
              copiarPregunta.textContent =
                "📋 Copiar pregunta";
            }

          }, 1600);

        } catch (error) {

          const textarea =
            document.createElement("textarea");

          textarea.value = texto;

          document.body.appendChild(textarea);

          textarea.select();

          document.execCommand("copy");

          textarea.remove();

          copiarPregunta.textContent =
            "✓ Copiada";

          setTimeout(() => {

            if (modal.classList.contains("visible")) {
              copiarPregunta.textContent =
                "📋 Copiar pregunta";
            }

          }, 1600);

        }

      }
    );


    /* =====================================================
       PAGINACIÓN
       ===================================================== */

    function renderizarPaginacion() {

      paginacion.innerHTML = "";

      if (resultadosActuales.length === 0) {
        return;
      }

      const totalPaginas =
        Math.ceil(
          resultadosActuales.length /
          preguntasPorPagina
        );

      if (totalPaginas <= 1) {
        return;
      }


      const anterior =
        document.createElement("button");

      anterior.className =
        "boton-pagina";

      anterior.textContent =
        "← Anterior";

      anterior.disabled =
        paginaActual === 1;

      anterior.addEventListener(
        "click",
        function() {

          if (paginaActual > 1) {

            paginaActual--;

            renderizarPreguntas();
            renderizarPaginacion();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }

        }
      );


      const paginaInfo =
        document.createElement("span");

      paginaInfo.className =
        "pagina-info";

      paginaInfo.textContent =
        `Página ${paginaActual} de ${totalPaginas}`;


      const siguiente =
        document.createElement("button");

      siguiente.className =
        "boton-pagina";

      siguiente.textContent =
        "Siguiente →";

      siguiente.disabled =
        paginaActual === totalPaginas;

      siguiente.addEventListener(
        "click",
        function() {

          if (paginaActual < totalPaginas) {

            paginaActual++;

            renderizarPreguntas();
            renderizarPaginacion();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }

        }
      );


      paginacion.appendChild(anterior);
      paginacion.appendChild(paginaInfo);
      paginacion.appendChild(siguiente);

    }


    /* =====================================================
       EVENTOS DE FILTROS
       ===================================================== */

    busqueda.addEventListener(
      "input",
      function() {
        actualizarResultados(true);
      }
    );


    filtroModulo.addEventListener(
      "change",
      function() {
        actualizarResultados(true);
      }
    );


    filtroEtapa.addEventListener(
      "change",
      function() {
        actualizarResultados(true);
      }
    );


    filtroSubtema.addEventListener(
      "change",
      function() {
        actualizarResultados(true);
      }
    );


    /* =====================================================
       INICIO
       ===================================================== */

    prepararFiltros();

    actualizarContadorFavoritos();

    actualizarResultados(true);

  </script>

</body>
</html>
