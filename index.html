* {

body {

  );
  color: var(--texto);
}

.container {

  padding: 40px 20px 60px;
}

header {
  background: linear-gradient(135deg, #2F5573, #5F8FB5);
  color: white;
  padding: 34px;
  border-radius: 22px;
  box-shadow: 0 12px 30px rgba(47, 85, 115, 0.16);
  margin-bottom: 24px;
}

h1 {
  margin: 0 0 8px;
  font-size: 32px;
}

.subtitle {
  margin: 0;
  opacity: 0.9;
  font-size: 16px;
}

.controls {
  background: white;
  padding: 22px;
  border: 1px solid var(--azul-borde);
  border-radius: 18px;
  box-shadow: 0 8px 22px rgba(47, 85, 115, 0.07);
  margin-bottom: 24px;
}

.search {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--azul-borde);
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  margin-bottom: 16px;
}

.search:focus {
  border-color: var(--azul);
  box-shadow: 0 0 0 3px rgba(76, 120, 160, 0.12);
}

.filters {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

select {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--azul-borde);
  border-radius: 10px;
  background: var(--celeste-claro);
  color: var(--texto);
  font-size: 14px;
  cursor: pointer;
}

.count {
  margin: 18px 0 14px;
  color: var(--texto-suave);
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.card {
  background: white;
  border: 1px solid var(--azul-borde);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 6px 18px rgba(47, 85, 115, 0.06);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(47, 85, 115, 0.10);
}

.number {
  display: inline-block;
  background: var(--celeste);
  color: var(--azul-oscuro);
  font-size: 12px;
  font-weight: bold;
  padding: 5px 9px;
  border-radius: 20px;
  margin-bottom: 12px;
}

.question {
  font-size: 17px;
  line-height: 1.55;
  margin: 0 0 16px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.tag {
  background: var(--celeste-claro);
  border: 1px solid var(--azul-borde);
  color: var(--azul-oscuro);
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
}

.empty {
  grid-column: 1 / -1;
  background: white;
  border: 1px dashed var(--azul-borde);
  border-radius: 16px;
  padding: 35px;
  text-align: center;
  color: var(--texto-suave);
}

@media (max-width: 760px) {
  .container {
    padding: 20px 14px 40px;
  }

  header {
    padding: 26px 22px;
  }

  h1 {
    font-size: 26px;
  }

  .filters,
  .grid {
    grid-template-columns: 1fr;

}

const search = document.getElementById("search");
const moduleFilter = document.getElementById("moduleFilter");
const stageFilter = document.getElementById("stageFilter");
const subtopicFilter = document.getElementById("subtopicFilter");
const results = document.getElementById("results");
const count = document.getElementById("count");


function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}


function llenarFiltro(elemento, valores) {

  valores.forEach(valor => {

    const option = document.createElement("option");

    option.value = valor;
    option.textContent = valor;

    elemento.appendChild(option);

  });

}


function mostrarPreguntas() {

  const texto = normalizar(search.value);
  const modulo = moduleFilter.value;
  const etapa = stageFilter.value;
  const subtema = subtopicFilter.value;


  const filtradas = preguntas.filter(item =>

    (!texto ||
      normalizar(item.pregunta).includes(texto)
    )

    &&

    (!modulo ||
      item.modulo === modulo
    )

    &&

    (!etapa ||
      item.etapa === etapa
    )

    &&

    (!subtema ||
      item.subtema === subtema
    )

  );


  count.textContent =
    `Mostrando ${filtradas.length} de ${preguntas.length} preguntas`;


  if (!filtradas.length) {

    results.innerHTML = `
      <div class="empty">
        No encontramos preguntas con estos criterios.
      </div>
    `;

    return;
  }


  results.innerHTML = filtradas.map(item => {

    const numero = preguntas.indexOf(item) + 1;

    return `
      <article class="card">

        <div class="number">
          PREGUNTA ${numero}
        </div>

        <p class="question">
          ${item.pregunta}
        </p>

        <div class="tags">

          <span class="tag">
            ${item.modulo}
          </span>

          <span class="tag">
            ${item.etapa}
          </span>

          <span class="tag">
            ${item.subtema}
          </span>

        </div>

      </article>
    `;

  }).join("");

}


const modulos = [
  ...new Set(
    preguntas.map(p => p.modulo)
  )
].sort();


const etapas = [
  ...new Set(
    preguntas.map(p => p.etapa)
  )
].sort();


const subtemas = [
  ...new Set(
    preguntas.map(p => p.subtema)
  )
].sort();


llenarFiltro(
  moduleFilter,
  modulos
);

llenarFiltro(
  stageFilter,
  etapas
);

llenarFiltro(
  subtopicFilter,
  subtemas
);


search.addEventListener(
  "input",
  mostrarPreguntas
);

moduleFilter.addEventListener(
  "change",
  mostrarPreguntas
);

stageFilter.addEventListener(
  "change",
  mostrarPreguntas
);

subtopicFilter.addEventListener(
  "change",
  mostrarPreguntas
);


mostrarPreguntas();

</script>
