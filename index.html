<!DOCTYPE html>
<html lang="es">
<head>

  <title>Banco de Preguntas Temple</title>

  <style>
    :root {
      --azul-oscuro: #2F5573;
      --azul: #4C78A0;
      --azul-medio: #6FA3C8;
      --celeste: #DCECF7;
      --celeste-claro: #F4FAFD;
      --azul-borde: #B8D4E8;
      --texto: #263746;
      --texto-suave: #607789;
      --blanco: #FFFFFF;
      --sombra: 0 8px 25px rgba(47, 85, 115, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--celeste-claro);
      color: var(--texto);
      line-height: 1.5;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--azul-oscuro), var(--azul));
      color: white;
      padding: 45px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
      opacity: 0.92;
    }

    /* CONTENEDOR */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    /* BUSCADOR */
    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid var(--azul-borde);
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: white;
      color: var(--texto);
      transition: 0.2s;
    }

    .search-box input:focus {
      border-color: var(--azul-medio);
      box-shadow: 0 0 0 3px rgba(111, 163, 200, 0.15);
    }

    /* FILTROS */
    .filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .filters select {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--azul-borde);
      border-radius: 10px;
      background: white;
      color: var(--texto);
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .filters select:focus {
      border-color: var(--azul-medio);
    }

    /* CONTADOR */
    .results-info {
      margin-bottom: 20px;
      color: var(--texto-suave);
      font-size: 14px;
    }

    /* GRID */
    .questions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* TARJETA */
    .card {
      background: var(--blanco);
      border: 1px solid var(--azul-borde);
      border-radius: 15px;
      padding: 22px;
      box-shadow: var(--sombra);
      display: flex;
      flex-direction: column;
      min-height: 250px;
    }

    .question-number {
      color: var(--azul);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--texto);
      margin-bottom: 18px;
      flex-grow: 1;
    }

    /* ETIQUETAS */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 18px;
    }

    .tag {
      background: var(--celeste);
      color: var(--azul-oscuro);
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 11px;
      line-height: 1.3;
    }

    /* BOTÓN */
    .view-button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 11px 15px;
      background: var(--azul);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .view-button:hover {
      background: var(--azul-oscuro);
    }

    /* SIN RESULTADOS */
    .no-results {
      grid-column: 1 / -1;
      background: white;
      border: 1px solid var(--azul-borde);
      border-radius: 15px;
      padding: 40px 20px;
      text-align: center;
      color: var(--texto-suave);
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(38, 55, 70, 0.55);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
      animation: modalAppear 0.2s ease;
    }

    @keyframes modalAppear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .close-button {
      position: absolute;
      top: 15px;
      right: 18px;
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 50%;
      background: var(--celeste);
      color: var(--azul-oscuro);
      font-size: 22px;
      line-height: 35px;
      cursor: pointer;
    }

    .close-button:hover {
      background: var(--azul-borde);
    }

    .modal-number {
      color: var(--azul);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      padding-right: 40px;
    }

    .modal-question {
      font-size: 23px;
      line-height: 1.45;
      color: var(--texto);
      margin-bottom: 25px;
      padding-right: 20px;
    }

    .modal-details {
      border-top: 1px solid var(--azul-borde);
      padding-top: 20px;
    }

    .detail {
      margin-bottom: 14px;
    }

    .detail-label {
      display: block;
      font-size: 12px;
      color: var(--texto-suave);
      margin-bottom: 4px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .detail-value {
      font-size: 14px;
      color: var(--texto);
    }

    /* RESPONSIVE */
    @media (max-width: 800px) {
      .questions-grid {
        grid-template-columns: 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 27px;
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 20px 15px 40px;
      }

      header {
        padding: 35px 15px;
      }

      .card {
        padding: 18px;
      }

      .modal-content {
        padding: 25px 20px;
      }

      .modal-question {
        font-size: 20px;
      }
    }
  </style>
</head>

    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const searchInput = document.getElementById("searchInput");
    const moduloFilter = document.getElementById("moduloFilter");
    const etapaFilter = document.getElementById("etapaFilter");
    const subtemaFilter = document.getElementById("subtemaFilter");
    const questionsGrid = document.getElementById("questionsGrid");
    const resultsInfo = document.getElementById("resultsInfo");

    const questionModal = document.getElementById("questionModal");
    const closeModal = document.getElementById("closeModal");

    const modalNumber = document.getElementById("modalNumber");
    const modalQuestion = document.getElementById("modalQuestion");
    const modalModulo = document.getElementById("modalModulo");
    const modalEtapa = document.getElementById("modalEtapa");
    const modalSubtema = document.getElementById("modalSubtema");


    /* =====================================================
       CREAR OPCIONES DE FILTROS
       ===================================================== */

    function llenarFiltro(select, valores) {

      const valoresUnicos = [...new Set(valores)].sort();

      valoresUnicos.forEach(valor => {

        const option = document.createElement("option");

        option.value = valor;
        option.textContent = valor;

        select.appendChild(option);

      });

    }

    llenarFiltro(
      moduloFilter,
      preguntas.map(p => p.modulo)
    );

    llenarFiltro(
      etapaFilter,
      preguntas.map(p => p.etapa)
    );

    llenarFiltro(
      subtemaFilter,
      preguntas.map(p => p.subtema)
    );


    /* =====================================================
       MOSTRAR PREGUNTAS
       ===================================================== */

    function mostrarPreguntas() {

      const texto = searchInput.value
        .toLowerCase()
        .trim();

      const modulo = moduloFilter.value;
      const etapa = etapaFilter.value;
      const subtema = subtemaFilter.value;


      const resultados = preguntas.filter(p => {

        const coincideTexto =
          p.pregunta.toLowerCase().includes(texto);

        const coincideModulo =
          !modulo || p.modulo === modulo;

        const coincideEtapa =
          !etapa || p.etapa === etapa;

        const coincideSubtema =
          !subtema || p.subtema === subtema;

        return (
          coincideTexto &&
          coincideModulo &&
          coincideEtapa &&
          coincideSubtema
        );

      });


      resultsInfo.textContent =
        `${resultados.length} pregunta${resultados.length !== 1 ? "s" : ""} encontrada${resultados.length !== 1 ? "s" : ""}`;


      questionsGrid.innerHTML = "";


      if (resultados.length === 0) {

        questionsGrid.innerHTML = `
          <div class="no-results">
            No encontramos preguntas con los criterios seleccionados.
          </div>
        `;

        return;
      }


      resultados.forEach(p => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

          <div class="question-number">
            PREGUNTA ${p.id}
          </div>

          <div class="question-text">
            ${p.pregunta}
          </div>

          <div class="tags">

            <span class="tag">
              ${p.modulo}
            </span>

            <span class="tag">
              ${p.etapa}
            </span>

            <span class="tag">
              ${p.subtema}
            </span>

          </div>

          <button
            class="view-button"
            onclick="abrirPregunta(${p.id})"
          >
            Ver pregunta
          </button>

        `;

        questionsGrid.appendChild(card);

      });

    }


    /* =====================================================
       ABRIR MODAL
       ===================================================== */

    function abrirPregunta(id) {

      const pregunta = preguntas.find(p => p.id === id);

      if (!pregunta) return;

      modalNumber.textContent =
        `PREGUNTA ${pregunta.id}`;

      modalQuestion.textContent =
        pregunta.pregunta;

      modalModulo.textContent =
        pregunta.modulo;

      modalEtapa.textContent =
        pregunta.etapa;

      modalSubtema.textContent =
        pregunta.subtema;


      questionModal.classList.add("active");

      document.body.style.overflow = "hidden";

    }


    /* =====================================================
       CERRAR MODAL
       ===================================================== */

    function cerrarPregunta() {

      questionModal.classList.remove("active");

      document.body.style.overflow = "";

    }


    closeModal.addEventListener(
      "click",
      cerrarPregunta
    );


    /* Cerrar haciendo clic fuera */
    questionModal.addEventListener(
      "click",
      function(event) {

        if (event.target === questionModal) {
          cerrarPregunta();
        }

      }
    );


    /* Cerrar con ESC */
    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          questionModal.classList.contains("active")
        ) {
          cerrarPregunta();
        }

      }
    );


    /* =====================================================
       EVENTOS DE FILTROS Y BUSCADOR
       ===================================================== */

    searchInput.addEventListener(
      "input",
      mostrarPreguntas
    );

    moduloFilter.addEventListener(
      "change",
      mostrarPreguntas
    );

    etapaFilter.addEventListener(
      "change",
      mostrarPreguntas
    );

    subtemaFilter.addEventListener(
      "change",
      mostrarPreguntas
    );


    /* =====================================================
       CARGA INICIAL
       ===================================================== */

    mostrarPreguntas();

  </script>
