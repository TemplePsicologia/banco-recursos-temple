<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de Preguntas Temple</title>

  <style>
    :root {
      --azul-oscuro: #2F5573;
      --azul: #4C78A0;
      --azul-medio: #6FA3C8;
      --celeste: #DCECF7;
      --celeste-claro: #F4FAFD;
      --azul-borde: #B8D4E8;
      --texto: #263746;
      --texto-suave: #607789;
      --blanco: #FFFFFF;
      --estrella: #E7B84B;
      --sombra: 0 8px 25px rgba(47, 85, 115, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--celeste-claro);
      color: var(--texto);
      line-height: 1.5;
    }

    /* HEADER */

    header {
      background: linear-gradient(135deg, var(--azul-oscuro), var(--azul));
      color: white;
      padding: 45px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
      opacity: 0.92;
    }

    /* CONTENEDOR */

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    /* BUSCADOR */

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid var(--azul-borde);
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: white;
      color: var(--texto);
      transition: 0.2s;
    }

    .search-box input:focus {
      border-color: var(--azul-medio);
      box-shadow: 0 0 0 3px rgba(111, 163, 200, 0.15);
    }

    /* FILTROS */

    .filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 15px;
    }

    .filters select {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--azul-borde);
      border-radius: 10px;
      background: white;
      color: var(--texto);
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .filters select:focus {
      border-color: var(--azul-medio);
    }

    /* FILTRO FAVORITOS */

    .favorites-filter {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 22px;
    }

    .favorites-button {
      border: 1px solid var(--azul-borde);
      border-radius: 10px;
      padding: 11px 16px;
      background: white;
      color: var(--azul-oscuro);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .favorites-button:hover {
      background: var(--celeste);
    }

    .favorites-button.active {
      background: var(--celeste);
      border-color: var(--azul-medio);
    }

    /* CONTADOR */

    .results-info {
      margin-bottom: 20px;
      color: var(--texto-suave);
      font-size: 14px;
    }

    /* GRID */

    .questions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* TARJETA */

    .card {
      position: relative;
      background: var(--blanco);
      border: 1px solid var(--azul-borde);
      border-radius: 15px;
      padding: 22px;
      box-shadow: var(--sombra);
      display: flex;
      flex-direction: column;
      min-height: 250px;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(47, 85, 115, 0.14);
    }

    /* ESTRELLA */

    .favorite-button {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 36px;
      height: 36px;
      border: 1px solid var(--azul-borde);
      border-radius: 50%;
      background: white;
      color: #AAB9C4;
      font-size: 20px;
      line-height: 34px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      z-index: 2;
    }

    .favorite-button:hover {
      background: var(--celeste);
      color: var(--estrella);
      transform: scale(1.05);
    }

    .favorite-button.active {
      color: var(--estrella);
      border-color: #E7D49A;
      background: #FFF9E8;
    }

    .question-number {
      color: var(--azul);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      padding-right: 45px;
    }

    .question-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--texto);
      margin-bottom: 18px;
      flex-grow: 1;
      padding-right: 10px;
    }

    /* ETIQUETAS */

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 18px;
    }

    .tag {
      background: var(--celeste);
      color: var(--azul-oscuro);
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 11px;
      line-height: 1.3;
    }

    /* BOTÓN VER PREGUNTA */

    .view-button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 11px 15px;
      background: var(--azul);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .view-button:hover {
      background: var(--azul-oscuro);
    }

    /* SIN RESULTADOS */

    .no-results {
      grid-column: 1 / -1;
      background: white;
      border: 1px solid var(--azul-borde);
      border-radius: 15px;
      padding: 40px 20px;
      text-align: center;
      color: var(--texto-suave);
    }

    /* PAGINACIÓN */

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 35px;
      flex-wrap: wrap;
    }

    .pagination button {
      border: 1px solid var(--azul-borde);
      border-radius: 9px;
      min-width: 40px;
      padding: 10px 13px;
      background: white;
      color: var(--azul-oscuro);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      background: var(--celeste);
    }

    .pagination button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pagination button.page-active {
      background: var(--azul);
      border-color: var(--azul);
      color: white;
    }

    .pagination .arrow-button {
      padding: 10px 15px;
    }

    .page-info {
      color: var(--texto-suave);
      font-size: 13px;
      margin: 0 8px;
      white-space: nowrap;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(38, 55, 70, 0.55);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
      animation: modalAppear 0.2s ease;
    }
