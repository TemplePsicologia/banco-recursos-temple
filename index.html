<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Banco de Preguntas Temple</title>

  <style>

    :root {
      --azul-oscuro: #2F5573;
      --azul: #4C78A0;
      --azul-medio: #6FA3C8;
      --celeste: #DCECF7;
      --celeste-claro: #F4FAFD;
      --azul-borde: #B8D4E8;
      --texto: #263746;
      --texto-suave: #607789;
      --blanco: #FFFFFF;
      --gris: #F5F7F9;
      --sombra: 0 8px 25px rgba(47, 85, 115, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--celeste-claro);
      color: var(--texto);
    }

    /* ENCABEZADO */

    header {
      background: var(--azul-oscuro);
      color: white;
      padding: 42px 20px 38px;
    }

    .header-inner {
      max-width: 1180px;
      margin: auto;
    }

    .marca {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.85;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.2;
    }

    .subtitulo {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
    }

    /* CONTENEDOR */

    .contenedor {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 50px;
    }

    /* BUSCADOR */

    .buscador {
      background: var(--blanco);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--sombra);
      margin-bottom: 18px;
    }

    .input-busqueda {
      width: 100%;
      padding: 15px 17px;
      border: 1px solid var(--azul-borde);
      border-radius: 11px;
      font-size: 15px;
      color: var(--texto);
      outline: none;
      transition: 0.2s;
    }

    .input-busqueda:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(76, 120, 160, 0.10);
    }

    /* FILTROS */

    .filtros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--azul-borde);
      border-radius: 10px;
      background: white;
      color: var(--texto);
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--azul);
    }

    /* FAVORITOS */

    .barra-favoritos {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #E7EEF3;
    }

    .favoritos-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .favoritos-titulo {
      font-size: 14px;
      font-weight: 700;
      color: var(--texto);
    }

    .contador-favoritos {
      font-size: 12px;
      color: var(--texto-suave);
    }

    .boton-favoritos {
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      padding: 10px 15px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .boton-favoritos:hover {
      background: var(--celeste);
    }

    .boton-favoritos.activo {
      background: var(--azul-oscuro);
      color: white;
      border-color: var(--azul-oscuro);
    }

    /* SELECCIÓN MÚLTIPLE */

    .barra-seleccion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding: 14px 15px;
      background: var(--celeste-claro);
      border: 1px solid var(--azul-borde);
      border-radius: 11px;
    }

    .seleccion-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .seleccion-titulo {
      font-size: 13px;
      font-weight: 700;
      color: var(--texto);
    }

    .contador-seleccion {
      font-size: 12px;
      color: var(--texto-suave);
    }

    .seleccion-acciones {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .boton-seleccion {
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .boton-seleccion:hover:not(:disabled) {
      border-color: var(--azul);
    }

    .boton-seleccion.principal {
      background: var(--azul-oscuro);
      color: white;
      border-color: var(--azul-oscuro);
    }

    .boton-seleccion.principal:hover:not(:disabled) {
      background: var(--azul);
    }

    .boton-seleccion:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* INFORMACIÓN */

    .info-resultados {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 22px 2px 15px;
      color: var(--texto-suave);
      font-size: 14px;
    }

    /* TARJETAS */

    .grid-preguntas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .tarjeta {
      position: relative;
      background: white;
      border: 1px solid #E2EBF1;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(47, 85, 115, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .tarjeta:hover {
      transform: translateY(-2px);
      box-shadow: var(--sombra);
    }

    .tarjeta.seleccionada {
      border-color: var(--azul-medio);
      box-shadow: 0 0 0 2px rgba(111, 163, 200, 0.12);
    }

    .seleccion-pregunta {
      margin-bottom: 12px;
    }

    .checkbox-pregunta {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--texto-suave);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-pregunta input {
      width: 16px;
      height: 16px;
      accent-color: var(--azul-oscuro);
      cursor: pointer;
    }

    .numero-pregunta {
      color: var(--azul);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .pregunta-texto {
      font-size: 16px;
      line-height: 1.55;
      margin: 0 42px 18px 0;
      color: var(--texto);
    }

    .estrella-tarjeta {
      position: absolute;
      right: 17px;
      top: 15px;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      font-size: 23px;
      color: #AAB9C4;
      transition: 0.2s;
    }

    .estrella-tarjeta:hover {
      background: var(--celeste-claro);
      transform: scale(1.08);
    }

    .estrella-tarjeta.activa {
      color: #E3A72F;
    }

    .etiquetas {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 17px;
    }

    .etiqueta {
      background: var(--celeste);
      color: var(--azul-oscuro);
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 11px;
      line-height: 1.3;
    }

    .boton-ver {
      width: 100%;
      border: 0;
      background: var(--azul-oscuro);
      color: white;
      padding: 11px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }

    .boton-ver:hover {
      background: var(--azul);
    }

    /* PAGINACIÓN */

    .paginacion {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
    }

    .boton-pagina {
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .boton-pagina:hover:not(:disabled) {
      background: var(--celeste);
    }

    .boton-pagina:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pagina-info {
      font-size: 13px;
      color: var(--texto-suave);
      min-width: 150px;
      text-align: center;
    }

    /* ESTADO VACÍO */

    .sin-resultados {
      background: white;
      border: 1px solid #E2EBF1;
      border-radius: 15px;
      padding: 45px 25px;
      text-align: center;
      color: var(--texto-suave);
      grid-column: 1 / -1;
    }

    .sin-resultados-icono {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .sin-resultados h3 {
      color: var(--texto);
      margin: 0 0 8px;
      font-size: 18px;
    }

    .sin-resultados p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(22, 40, 53, 0.58);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.visible {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-contenido {
      position: relative;
      width: 100%;
      max-width: 650px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.20);
    }

    .cerrar-modal {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 38px;
      height: 38px;
      border: 0;
      background: var(--gris);
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      color: var(--texto);
    }

    .cerrar-modal:hover {
      background: var(--celeste);
    }

    .modal-numero {
      color: var(--azul);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .modal-pregunta {
      font-size: 21px;
      line-height: 1.5;
      color: var(--texto);
      margin: 0 45px 22px 0;
    }

    .modal-datos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .modal-acciones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .accion {
      flex: 1;
      min-width: 180px;
      padding: 12px 15px;
      border-radius: 9px;
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .accion:hover {
      background: var(--celeste-claro);
    }

    .accion-principal {
      background: var(--azul-oscuro);
      color: white;
      border-color: var(--azul-oscuro);
    }

    .accion-principal:hover {
      background: var(--azul);
    }

    .accion-favorito.activa {
      background: #FFF8E8;
      border-color: #E8C56B;
      color: #9A7119;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 20px;
      color: var(--texto-suave);
      font-size: 12px;
    }

    /* RESPONSIVE */

    @media (max-width: 800px) {

      .grid-preguntas {
        grid-template-columns: 1fr;
      }

      .filtros {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;
      }

    }

    @media (max-width: 500px) {

      header {
        padding: 32px 18px;
      }

      .contenedor {
        padding: 20px 14px 40px;
      }

      .modal-contenido {
        padding: 24px 20px;
      }

      .modal-pregunta {
        font-size: 18px;
      }

      .info-resultados {
        align-items: flex-start;
        flex-direction: column;
      }

      .barra-seleccion {
        align-items: flex-start;
      }

      .seleccion-acciones {
        width: 100%;
      }

      .boton-seleccion {
        flex: 1;
      }

    }

  </style>
</head>

<body>

  <header>

    <div class="header-inner">

      <div class="marca">
        TEMPLE · RECURSOS PARA TU PRÁCTICA
      </div>

      <h1>
        Banco de Preguntas Temple
      </h1>

      <p class="subtitulo">
        Explora y encuentra preguntas para tu práctica profesional.
      </p>

    </div>

  </header>


  <main class="contenedor">

    <section class="buscador">

      <input
        type="search"
        id="busqueda"
        class="input-busqueda"
        placeholder="🔎 Buscar una pregunta..."
        autocomplete="off"
      >

      <div class="filtros">

        <select id="filtroModulo">
          <option value="">Todos los módulos</option>
        </select>

        <select id="filtroEtapa">
          <option value="">Todas las etapas</option>
        </select>

        <select id="filtroSubtema">
          <option value="">Todos los subtemas</option>
        </select>

      </div>


      <div class="barra-favoritos">

        <div class="favoritos-info">

          <span class="favoritos-titulo">
            Mis favoritas
          </span>

          <span
            id="contadorFavoritos"
            class="contador-favoritos"
          >
            0 preguntas guardadas
          </span>

        </div>

        <button
          id="botonFavoritos"
          class="boton-favoritos"
          type="button"
        >
          ☆ Ver favoritas
        </button>

      </div>


      <div
        id="barraSeleccion"
        class="barra-seleccion"
      >

        <div class="seleccion-info">

          <span class="seleccion-titulo">
            Preguntas seleccionadas
          </span>

          <span
            id="contadorSeleccion"
            class="contador-seleccion"
          >
            0 preguntas seleccionadas
          </span>

        </div>

        <div class="seleccion-acciones">

          <button
            id="copiarSeleccionadas"
            class="boton-seleccion principal"
            type="button"
            disabled
          >
            📋 Copiar seleccionadas
          </button>

          <button
            id="limpiarSeleccion"
            class="boton-seleccion"
            type="button"
            disabled
          >
            Limpiar
          </button>

        </div>

      </div>

    </section>


    <div class="info-resultados">

      <span id="contadorResultados">
        0 preguntas
      </span>

      <span id="textoPagina"></span>

    </div>


    <section
      id="listaPreguntas"
      class="grid-preguntas"
    ></section>


    <div
      id="paginacion"
      class="paginacion"
    ></div>

  </main>


  <footer>
    Banco de Preguntas Temple · Recursos para la práctica profesional
  </footer>


  <!-- MODAL -->

  <div id="modal" class="modal">

    <div class="modal-contenido">

      <button
        id="cerrarModal"
        class="cerrar-modal"
        type="button"
        aria-label="Cerrar"
      >
        ×
      </button>

      <div
        id="modalNumero"
        class="modal-numero"
      ></div>

      <h2
        id="modalPregunta"
        class="modal-pregunta"
      ></h2>

      <div
        id="modalDatos"
        class="modal-datos"
      ></div>

      <div class="modal-acciones">

        <button
          id="modalFavorito"
          class="accion accion-favorito"
          type="button"
        >
          ☆ Agregar a favoritas
        </button>

        <button
          id="copiarPregunta"
          class="accion accion-principal"
          type="button"
        >
          📋 Copiar pregunta
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       DATOS
       ===================================================== */

    const moduloGeneral =
      "Módulo 5 · Recursos cambio e integración";

    const etapaGeneral =
      "Orientar";


    const preguntas = [];


    function agregarPreguntas(
      inicio,
      subtema,
      lista
    ) {

      lista.forEach(
        (pregunta, indice) => {

          preguntas.push({

            id: inicio + indice,

            pregunta: pregunta,

            modulo: moduloGeneral,

            etapa: etapaGeneral,

            subtema: subtema

          });

        }
      );

    }


    agregarPreguntas(
      1,
      "Cierre e integración",
      [

        "¿Qué te gustaría que fuera diferente al terminar este proceso?",
        "¿Qué cambios reconoces en ti que antes no estaban presentes?",
        "¿Qué aprendiste sobre ti a lo largo de este proceso?",
        "¿Qué parte del proceso sientes que fue más significativa para ti?",
        "¿Qué te gustaría conservar de lo que has construido hasta ahora?",
        "¿Qué recursos personales reconoces ahora con mayor claridad?",
        "¿Qué situación actual podrías afrontar de manera diferente gracias a lo trabajado?",
        "¿Qué idea sobre ti mismo ha cambiado durante este proceso?",
        "¿Qué señales te indicarían que estás volviendo a tus patrones anteriores?",
        "¿Qué te gustaría recordar cuando atravieses nuevamente un momento difícil?",
        "¿Qué decisión relacionada con tu bienestar quieres seguir sosteniendo?",
        "¿Qué aspecto de este proceso quieres seguir explorando por tu cuenta?",
        "¿Qué diferencia notas entre cómo enfrentabas antes una dificultad y cómo la enfrentas ahora?",
        "¿Qué te llevas de este proceso que pueda acompañarte en otras áreas de tu vida?",
        "¿Qué cambio pequeño representa para ti un avance importante?",
        "¿Qué parte de ti sientes que ahora comprendes mejor?",
        "¿Qué has descubierto sobre aquello que necesitas para sentirte mejor?",
        "¿Qué situación te gustaría observar con mayor conciencia de ahora en adelante?",
        "¿Qué te gustaría reconocer de ti mismo al mirar hacia atrás?",
        "Si tuvieras que resumir lo más importante que aprendiste, ¿qué dirías?"

      ]
    );


    agregarPreguntas(
      21,
      "Sostenimiento del cambio",
      [

        "¿Qué necesitas hacer para mantener este cambio en el tiempo?",
        "¿Qué hábito podría ayudarte a sostener lo que has logrado?",
        "¿Qué situaciones podrían dificultar que mantengas este cambio?",
        "¿Cómo podrías prepararte para momentos en los que te resulte difícil continuar?",
        "¿Qué apoyo podrías buscar si notas que estás perdiendo lo avanzado?",
        "¿Qué señales te ayudarían a detectar a tiempo un retroceso?",
        "¿Qué conducta concreta quieres seguir practicando?",
        "¿Qué podría hacer más fácil mantener este cambio durante las próximas semanas?",
        "¿Qué obstáculos necesitas anticipar para cuidar lo que has construido?",
        "¿Qué recordatorio podrías utilizar cuando aparezca la duda?",
        "¿Qué persona podría ayudarte a mantener presente este objetivo?",
        "¿Qué diferencia hay entre mantener un cambio y exigir que todo sea perfecto?",
        "¿Cómo podrías responder si tienes un día en el que vuelves a una conducta anterior?",
        "¿Qué te ayudaría a volver a intentarlo después de una dificultad?",
        "¿Qué parte del cambio depende directamente de ti?",
        "¿Qué necesitas aceptar para poder sostener este proceso?",
        "¿Qué comportamiento sería una señal de que estás cuidando tu avance?",
        "¿Qué puedes hacer cuando notes que estás perdiendo motivación?",
        "¿Qué necesitas recordar acerca del ritmo de tu propio proceso?",
        "¿Qué compromiso realista quieres asumir contigo mismo?"

      ]
    );


    agregarPreguntas(
      41,
      "Primeros pasos",
      [

        "¿Cuál sería un primer paso suficientemente pequeño como para poder hacerlo esta semana?",
        "¿Qué podrías hacer hoy para acercarte un poco a lo que quieres?",
        "¿Qué estás esperando para dar ese primer paso?",
        "¿Qué haría que comenzar fuera más sencillo?",
        "¿Qué parte de este cambio puedes empezar a trabajar sin esperar a sentirte completamente preparado?",
        "¿Qué acción concreta podrías realizar en las próximas 24 horas?",
        "¿Qué necesitas organizar antes de comenzar?",
        "¿Qué pequeño cambio en tu rutina podría facilitar este proceso?",
        "¿Qué podrías probar en lugar de seguir haciendo lo mismo?",
        "¿Qué acción te permitiría obtener información antes de tomar una decisión mayor?",
        "¿Qué sería un avance pequeño pero observable?",
        "¿Qué puedes hacer aunque todavía tengas dudas?",
        "¿Qué obstáculo puedes resolver antes de dar el siguiente paso?",
        "¿Qué necesitas dejar de esperar para comenzar?",
        "¿Qué paso te parece posible incluso en un día difícil?",
        "¿Qué recurso ya tienes y podrías utilizar para comenzar?",
        "¿Qué podrías simplificar para que empezar no se sienta tan pesado?",
        "¿Qué sería suficientemente bueno para comenzar, aunque no sea perfecto?",
        "¿Qué acción depende completamente de ti?",
        "¿Cuál quieres que sea tu siguiente paso concreto?"

      ]
    );


    agregarPreguntas(
      61,
      "Decisiones y prioridades",
      [

        "¿Qué decisión estás evitando tomar en este momento?",
        "¿Qué necesitas tener claro para poder decidir?",
        "¿Qué opción se acerca más a lo que realmente necesitas?",
        "¿Qué estás priorizando actualmente y por qué?",
        "¿Qué estás dejando de lado al elegir esta opción?",
        "¿Qué criterio quieres utilizar para tomar esta decisión?",
        "¿Qué diferencia hay entre lo que quieres y lo que sientes que deberías elegir?",
        "¿Qué consecuencia estás considerando con mayor peso?",
        "¿Qué información te falta para sentir que puedes decidir con mayor claridad?",
        "¿Qué decisión sería coherente con la persona que quieres ser?",
        "¿Qué estás intentando resolver al mismo tiempo y podrías separar?",
        "¿Qué asunto necesita tu atención primero?",
        "¿Qué puedes postergar sin que eso perjudique tu bienestar?",
        "¿Qué prioridad has dejado de lado por atender las necesidades de otras personas?",
        "¿Qué elección estás haciendo por miedo y cuál harías desde tus necesidades?",
        "¿Qué sería importante considerar además de lo que estás sintiendo ahora?",
        "¿Qué opción te permitiría cuidar mejor tus límites?",
        "¿Qué estás priorizando por costumbre y no necesariamente por necesidad?",
        "¿Qué decisión podría ayudarte a recuperar espacio para ti?",
        "Si tuvieras que elegir una sola prioridad para este momento, ¿cuál sería?"

      ]
    );


    agregarPreguntas(
      81,
      "Objetivos personales",
      [

        "¿Qué objetivo personal te gustaría trabajar primero?",
        "¿Cómo sabrías que estás avanzando hacia ese objetivo?",
        "¿Qué significa para ti alcanzar este objetivo?",
        "¿Este objetivo nace de una necesidad propia o de una expectativa externa?",
        "¿Qué cambiaría en tu vida si consiguieras este objetivo?",
        "¿Qué parte del objetivo está bajo tu control?",
        "¿Qué primer indicador te mostraría que estás avanzando?",
        "¿Qué necesitas aprender o practicar para acercarte a este objetivo?",
        "¿Qué obstáculo personal podría aparecer en el camino?",
        "¿Qué apoyo podrías necesitar para alcanzar este objetivo?",
        "¿Qué parte de este objetivo puedes convertir en una acción concreta?",
        "¿Qué expectativas necesitas ajustar para que este objetivo sea realista?",
        "¿Qué te gustaría conseguir para ti independientemente de lo que hagan otras personas?",
        "¿Qué estás dispuesto a hacer de manera diferente para acercarte a este objetivo?",
        "¿Qué tendría que cambiar en tu día a día para que este objetivo tenga espacio?",
        "¿Qué te podría hacer abandonar este objetivo y cómo podrías anticiparlo?",
        "¿Qué objetivo sería importante aunque nadie más lo reconociera?",
        "¿Qué necesitas aceptar sobre tu situación actual antes de plantearte el siguiente paso?",
        "¿Qué quieres empezar a construir a partir de este momento?",
        "¿Cuál sería un objetivo personal concreto que puedas comenzar a trabajar desde ahora?"

      ]
    );


    /* =====================================================
       ESTADO
       ===================================================== */

    const preguntasPorPagina = 20;

    let paginaActual = 1;

    let resultadosActuales = [];

    let mostrarSoloFavoritas = false;

    let preguntasSeleccionadas = [];

    let preguntaModalActual = null;


    let favoritos = JSON.parse(
      localStorage.getItem("temple_favoritos") || "[]"
    );

    favoritos = favoritos.map(Number);


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const busqueda =
      document.getElementById("busqueda");

    const filtroModulo =
      document.getElementById("filtroModulo");

    const filtroEtapa =
      document.getElementById("filtroEtapa");

    const filtroSubtema =
      document.getElementById("filtroSubtema");


    const botonFavoritos =
      document.getElementById("botonFavoritos");

    const contadorFavoritos =
      document.getElementById("contadorFavoritos");


    const contadorResultados =
      document.getElementById("contadorResultados");

    const textoPagina =
      document.getElementById("textoPagina");


    const listaPreguntas =
      document.getElementById("listaPreguntas");

    const paginacion =
      document.getElementById("paginacion");


    const barraSeleccion =
      document.getElementById("barraSeleccion");

    const contadorSeleccion =
      document.getElementById("contadorSeleccion");

    const copiarSeleccionadas =
      document.getElementById("copiarSeleccionadas");

    const limpiarSeleccion =
      document.getElementById("limpiarSeleccion");


    const modal =
      document.getElementById("modal");

    const cerrarModal =
      document.getElementById("cerrarModal");


    const modalNumero =
      document.getElementById("modalNumero");

    const modalPregunta =
      document.getElementById("modalPregunta");

    const modalDatos =
      document.getElementById("modalDatos");


    const modalFavorito =
      document.getElementById("modalFavorito");

    const copiarPregunta =
      document.getElementById("copiarPregunta");


    /* =====================================================
       UTILIDADES
       ===================================================== */

    function escaparHTML(texto) {

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function esFavorita(id) {

      return favoritos.includes(
        Number(id)
      );

    }


    function guardarFavoritos() {

      localStorage.setItem(
        "temple_favoritos",
        JSON.stringify(favoritos)
      );

    }


    /* =====================================================
       FAVORITOS
       ===================================================== */

    function actualizarContadorFavoritos() {

      const cantidad =
        favoritos.length;


      contadorFavoritos.textContent =
        cantidad === 0
          ? "Todavía no has guardado preguntas"
          : cantidad === 1
            ? "1 pregunta guardada"
            : `${cantidad} preguntas guardadas`;


      if (mostrarSoloFavoritas) {

        botonFavoritos.textContent =
          "← Ver todas";

      } else {

        botonFavoritos.textContent =
          cantidad > 0
            ? "★ Ver favoritas"
            : "☆ Ver favoritas";

      }


      botonFavoritos.classList.toggle(
        "activo",
        mostrarSoloFavoritas
      );

    }


    function cambiarFavorito(id) {

      id = Number(id);


      if (esFavorita(id)) {

        favoritos =
          favoritos.filter(
            favorito => favorito !== id
          );

      } else {

        favoritos.push(id);

      }


      guardarFavoritos();

      actualizarResultados(false);


      if (
        preguntaModalActual &&
        Number(preguntaModalActual.id) === id
      ) {

        actualizarModalFavorito();

      }

    }


    botonFavoritos.addEventListener(
      "click",
      function() {

        mostrarSoloFavoritas =
          !mostrarSoloFavoritas;

        paginaActual = 1;

        actualizarResultados(false);

      }
    );


    /* =====================================================
       SELECCIÓN MÚLTIPLE
       ===================================================== */

    function actualizarBarraSeleccion() {

      const cantidad =
        preguntasSeleccionadas.length;


      contadorSeleccion.textContent =
        cantidad === 0
          ? "0 preguntas seleccionadas"
          : cantidad === 1
            ? "1 pregunta seleccionada"
            : `${cantidad} preguntas seleccionadas`;


      copiarSeleccionadas.disabled =
        cantidad === 0;

      limpiarSeleccion.disabled =
        cantidad === 0;

    }


    function limpiarPreguntasSeleccionadas() {

      preguntasSeleccionadas = [];

      actualizarBarraSeleccion();

      renderizarPreguntas();

    }


    limpiarSeleccion.addEventListener(
      "click",
      function() {

        limpiarPreguntasSeleccionadas();

      }
    );


    copiarSeleccionadas.addEventListener(
      "click",
      async function() {

        if (
          preguntasSeleccionadas.length === 0
        ) {
          return;
        }


        const preguntasParaCopiar =
          preguntas
            .filter(
              p =>
                preguntasSeleccionadas.includes(
                  Number(p.id)
                )
            )
            .sort(
              (a, b) => a.id - b.id
            );


        const texto =
          preguntasParaCopiar
            .map(
              p =>
                `${p.id}. ${p.pregunta}`
            )
            .join("\n");


        try {

          await navigator.clipboard.writeText(
            texto
          );


          copiarSeleccionadas.textContent =
            "✓ Copiadas";


          setTimeout(
            () => {

              copiarSeleccionadas.textContent =
                "📋 Copiar seleccionadas";

            },
            1600
          );


        } catch (error) {

          const textarea =
            document.createElement("textarea");

          textarea.value = texto;

          document.body.appendChild(
            textarea
          );

          textarea.select();

          document.execCommand("copy");

          textarea.remove();


          copiarSeleccionadas.textContent =
            "✓ Copiadas";


          setTimeout(
            () => {

              copiarSeleccionadas.textContent =
                "📋 Copiar seleccionadas";

            },
            1600
          );

        }

      }
    );


    /* =====================================================
       FILTROS
       ===================================================== */

    function valoresUnicos(campo) {

      return [
        ...new Set(
          preguntas.map(
            p => p[campo]
          )
        )
      ].sort();

    }


    function llenarFiltro(
      select,
      valores,
      textoInicial
    ) {

      select.innerHTML =
        `<option value="">${textoInicial}</option>`;


      valores.forEach(
        valor => {

          const option =
            document.createElement(
              "option"
            );

          option.value = valor;

          option.textContent = valor;

          select.appendChild(
            option
          );

        }
      );

    }


    function prepararFiltros() {

      llenarFiltro(
        filtroModulo,
        valoresUnicos("modulo"),
        "Todos los módulos"
      );


      llenarFiltro(
        filtroEtapa,
        valoresUnicos("etapa"),
        "Todas las etapas"
      );


      llenarFiltro(
        filtroSubtema,
        valoresUnicos("subtema"),
        "Todos los subtemas"
      );

    }


    /* =====================================================
       FILTRADO
       ===================================================== */

    function obtenerResultados() {

      const texto =
        busqueda.value
          .trim()
          .toLowerCase();


      const modulo =
        filtroModulo.value;

      const etapa =
        filtroEtapa.value;

      const subtema =
        filtroSubtema.value;


      resultadosActuales =
        preguntas.filter(
          p => {

            const coincideTexto =
              !texto ||
              p.pregunta
                .toLowerCase()
                .includes(texto) ||
              p.modulo
                .toLowerCase()
                .includes(texto) ||
              p.etapa
                .toLowerCase()
                .includes(texto) ||
              p.subtema
                .toLowerCase()
                .includes(texto);


            const coincideModulo =
              !modulo ||
              p.modulo === modulo;


            const coincideEtapa =
              !etapa ||
              p.etapa === etapa;


            const coincideSubtema =
              !subtema ||
              p.subtema === subtema;


            const coincideFavorito =
              !mostrarSoloFavoritas ||
              esFavorita(p.id);


            return (
              coincideTexto &&
              coincideModulo &&
              coincideEtapa &&
              coincideSubtema &&
              coincideFavorito
            );

          }
        );

    }


    function actualizarResultados(
      resetearPagina = true
    ) {

      obtenerResultados();


      if (resetearPagina) {

        paginaActual = 1;

      }


      const totalPaginas =
        Math.max(
          1,
          Math.ceil(
            resultadosActuales.length /
            preguntasPorPagina
          )
        );


      if (
        paginaActual >
        totalPaginas
      ) {

        paginaActual =
          totalPaginas;

      }


      renderizarPreguntas();

      renderizarPaginacion();

      actualizarContadorFavoritos();

      actualizarBarraSeleccion();

    }


    /* =====================================================
       PREGUNTAS
       ===================================================== */

    function renderizarPreguntas() {

      listaPreguntas.innerHTML = "";


      const inicio =
        (paginaActual - 1) *
        preguntasPorPagina;


      const fin =
        inicio +
        preguntasPorPagina;


      const pagina =
        resultadosActuales.slice(
          inicio,
          fin
        );


      contadorResultados.textContent =
        resultadosActuales.length === 1
          ? "1 pregunta"
          : `${resultadosActuales.length} preguntas`;


      if (
        resultadosActuales.length === 0
      ) {

        textoPagina.textContent = "";


        listaPreguntas.innerHTML = `

          <div class="sin-resultados">

            <div class="sin-resultados-icono">
              🔎
            </div>

            <h3>
              No encontramos preguntas
            </h3>

            <p>
              Prueba modificando la búsqueda
              o alguno de los filtros.
            </p>

          </div>

        `;


        return;

      }


      const totalPaginas =
        Math.ceil(
          resultadosActuales.length /
          preguntasPorPagina
        );


      textoPagina.textContent =
        `Página ${paginaActual} de ${totalPaginas}`;


      pagina.forEach(
        p => {

          const favorita =
            esFavorita(p.id);


          const seleccionada =
            preguntasSeleccionadas.includes(
              p.id
            );


          const tarjeta =
            document.createElement(
              "article"
            );


          tarjeta.className =
            `tarjeta ${
              seleccionada
                ? "seleccionada"
                : ""
            }`;


          tarjeta.innerHTML = `

            <div class="seleccion-pregunta">

              <label class="checkbox-pregunta">

                <input
                  type="checkbox"
                  class="checkbox-seleccion"
                  data-id="${p.id}"
                  ${
                    seleccionada
                      ? "checked"
                      : ""
                  }
                >

                <span>
                  Seleccionar
                </span>

              </label>

            </div>


            <button
              class="estrella-tarjeta ${
                favorita
                  ? "activa"
                  : ""
              }"
              type="button"
              aria-label="${
                favorita
                  ? "Quitar de favoritas"
                  : "Agregar a favoritas"
              }"
              title="${
                favorita
                  ? "Quitar de favoritas"
                  : "Agregar a favoritas"
              }"
              data-id="${p.id}"
            >
              ${
                favorita
                  ? "★"
                  : "☆"
              }
            </button>


            <div class="numero-pregunta">
              PREGUNTA ${p.id}
            </div>


            <p class="pregunta-texto">
              ${escaparHTML(
                p.pregunta
              )}
            </p>


            <div class="etiquetas">

              <span class="etiqueta">
                ${escaparHTML(
                  p.modulo
                )}
              </span>

              <span class="etiqueta">
                ${escaparHTML(
                  p.etapa
                )}
              </span>

              <span class="etiqueta">
                ${escaparHTML(
                  p.subtema
                )}
              </span>

            </div>


            <button
              class="boton-ver"
              type="button"
              data-id="${p.id}"
            >
              Ver pregunta
            </button>

          `;


          listaPreguntas.appendChild(
            tarjeta
          );

        }
      );


      document
        .querySelectorAll(
          ".checkbox-seleccion"
        )
        .forEach(
          checkbox => {

            checkbox.addEventListener(
              "change",
              function() {

                const id =
                  Number(
                    this.dataset.id
                  );


                if (this.checked) {

                  if (
                    !preguntasSeleccionadas.includes(
                      id
                    )
                  ) {

                    preguntasSeleccionadas.push(
                      id
                    );

                  }

                } else {

                  preguntasSeleccionadas =
                    preguntasSeleccionadas.filter(
                      preguntaId =>
                        preguntaId !== id
                    );

                }


                actualizarBarraSeleccion();

                renderizarPreguntas();

              }
            );

          }
        );


      document
        .querySelectorAll(
          ".estrella-tarjeta"
        )
        .forEach(
          btn => {

            btn.addEventListener(
              "click",
              function(event) {

                event.stopPropagation();

                cambiarFavorito(
                  Number(
                    this.dataset.id
                  )
                );

              }
            );

          }
        );


      document
        .querySelectorAll(
          ".boton-ver"
        )
        .forEach(
          btn => {

            btn.addEventListener(
              "click",
              function() {

                abrirModal(
                  Number(
                    this.dataset.id
                  )
                );

              }
            );

          }
        );

    }


    /* =====================================================
       MODAL
       ===================================================== */

    function abrirModal(id) {

      const pregunta =
        preguntas.find(
          p =>
            Number(p.id) ===
            Number(id)
        );


      if (!pregunta) {
        return;
      }


      preguntaModalActual =
        pregunta;


      modalNumero.textContent =
        `PREGUNTA ${pregunta.id}`;


      modalPregunta.textContent =
        pregunta.pregunta;


      modalDatos.innerHTML = `

        <span class="etiqueta">
          ${escaparHTML(
            pregunta.modulo
          )}
        </span>

        <span class="etiqueta">
          ${escaparHTML(
            pregunta.etapa
          )}
        </span>

        <span class="etiqueta">
          ${escaparHTML(
            pregunta.subtema
          )}
        </span>

      `;


      actualizarModalFavorito();


      copiarPregunta.textContent =
        "📋 Copiar pregunta";


      modal.classList.add(
        "visible"
      );


      document.body.style.overflow =
        "hidden";

    }


    function actualizarModalFavorito() {

      if (
        !preguntaModalActual
      ) {
        return;
      }


      const favorita =
        esFavorita(
          preguntaModalActual.id
        );


      if (favorita) {

        modalFavorito.textContent =
          "★ Quitar de favoritas";

      } else {

        modalFavorito.textContent =
          "☆ Agregar a favoritas";

      }


      modalFavorito.classList.toggle(
        "activa",
        favorita
      );

    }


    function cerrarElModal() {

      modal.classList.remove(
        "visible"
      );


      document.body.style.overflow =
        "";


      preguntaModalActual =
        null;

    }


    cerrarModal.addEventListener(
      "click",
      cerrarElModal
    );


    modal.addEventListener(
      "click",
      function(event) {

        if (
          event.target === modal
        ) {

          cerrarElModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          modal.classList.contains(
            "visible"
          )
        ) {

          cerrarElModal();

        }

      }
    );


    modalFavorito.addEventListener(
      "click",
      function() {

        if (
          !preguntaModalActual
        ) {
          return;
        }


        cambiarFavorito(
          preguntaModalActual.id
        );

      }
    );


    /* =====================================================
       COPIAR UNA PREGUNTA
       ===================================================== */

    copiarPregunta.addEventListener(
      "click",
      async function() {

        if (
          !preguntaModalActual
        ) {
          return;
        }


        const texto =
          preguntaModalActual.pregunta;


        try {

          await navigator.clipboard.writeText(
            texto
          );


          copiarPregunta.textContent =
            "✓ Copiada";


          setTimeout(
            () => {

              if (
                modal.classList.contains(
                  "visible"
                )
              ) {

                copiarPregunta.textContent =
                  "📋 Copiar pregunta";

              }

            },
            1600
          );


        } catch (error) {

          const textarea =
            document.createElement(
              "textarea"
            );


          textarea.value =
            texto;


          document.body.appendChild(
            textarea
          );


          textarea.select();

          document.execCommand(
            "copy"
          );


          textarea.remove();


          copiarPregunta.textContent =
            "✓ Copiada";


          setTimeout(
            () => {

              if (
                modal.classList.contains(
                  "visible"
                )
              ) {

                copiarPregunta.textContent =
                  "📋 Copiar pregunta";

              }

            },
            1600
          );

        }

      }
    );


    /* =====================================================
       PAGINACIÓN
       ===================================================== */

    function renderizarPaginacion() {

      paginacion.innerHTML = "";


      if (
        resultadosActuales.length === 0
      ) {
        return;
      }


      const totalPaginas =
        Math.ceil(
          resultadosActuales.length /
          preguntasPorPagina
        );


      if (
        totalPaginas <= 1
      ) {
        return;
      }


      const anterior =
        document.createElement(
          "button"
        );


      anterior.className =
        "boton-pagina";


      anterior.textContent =
        "← Anterior";


      anterior.disabled =
        paginaActual === 1;


      anterior.addEventListener(
        "click",
        function() {

          if (
            paginaActual > 1
          ) {

            paginaActual--;


            renderizarPreguntas();

            renderizarPaginacion();


            document
              .getElementById(
                "listaPreguntas"
              )
              .scrollIntoView({

                behavior: "smooth",

                block: "start"

              });

          }

        }
      );


      const paginaInfo =
        document.createElement(
          "span"
        );


      paginaInfo.className =
        "pagina-info";


      const inicio =
        (paginaActual - 1) *
        preguntasPorPagina + 1;


      const fin =
        Math.min(
          paginaActual *
            preguntasPorPagina,
          resultadosActuales.length
        );


      paginaInfo.textContent =
        `Preguntas ${inicio}–${fin} de ${resultadosActuales.length}`;


      const siguiente =
        document.createElement(
          "button"
        );


      siguiente.className =
        "boton-pagina";


      siguiente.textContent =
        "Siguiente →";


      siguiente.disabled =
        paginaActual === totalPaginas;


      siguiente.addEventListener(
        "click",
        function() {

          if (
            paginaActual <
            totalPaginas
          ) {

            paginaActual++;


            renderizarPreguntas();

            renderizarPaginacion();


            document
              .getElementById(
                "listaPreguntas"
              )
              .scrollIntoView({

                behavior: "smooth",

                block: "start"

              });

          }

        }
      );


      paginacion.appendChild(
        anterior
      );

      paginacion.appendChild(
        paginaInfo
      );

      paginacion.appendChild(
        siguiente
      );

    }


    /* =====================================================
       EVENTOS DE FILTROS
       ===================================================== */

    busqueda.addEventListener(
      "input",
      function() {

        actualizarResultados(true);

      }
    );


    filtroModulo.addEventListener(
      "change",
      function() {

        actualizarResultados(true);

      }
    );


    filtroEtapa.addEventListener(
      "change",
      function() {

        actualizarResultados(true);

      }
    );


    filtroSubtema.addEventListener(
      "change",
      function() {

        actualizarResultados(true);

      }
    );


    /* =====================================================
       INICIO
       ===================================================== */

    prepararFiltros();

    actualizarContadorFavoritos();

    actualizarBarraSeleccion();

    actualizarResultados(true);

  </script>

</body>
</html>
