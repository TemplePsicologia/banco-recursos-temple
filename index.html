<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Banco de Preguntas Temple</title>

  <style>

    :root {
      --azul-oscuro: #2F5573;
      --azul: #4C78A0;
      --azul-medio: #6FA3C8;
      --celeste: #DCECF7;
      --celeste-claro: #F4FAFD;
      --azul-borde: #B8D4E8;
      --texto: #263746;
      --texto-suave: #607789;
      --blanco: #FFFFFF;
      --gris: #F5F7F9;
      --sombra: 0 8px 25px rgba(47, 85, 115, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--celeste-claro);
      color: var(--texto);
    }

    /* ENCABEZADO */

    header {
      background: var(--azul-oscuro);
      color: white;
      padding: 42px 20px 38px;
    }

    .header-inner {
      max-width: 1180px;
      margin: auto;
    }

    .marca {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.85;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.2;
    }

    .subtitulo {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
    }

    /* CONTENEDOR */

    .contenedor {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 50px;
    }

    /* BUSCADOR */

    .buscador {
      background: var(--blanco);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--sombra);
      margin-bottom: 18px;
    }

    .input-busqueda {
      width: 100%;
      padding: 15px 17px;
      border: 1px solid var(--azul-borde);
      border-radius: 11px;
      font-size: 15px;
      color: var(--texto);
      outline: none;
      transition: 0.2s;
    }

    .input-busqueda:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(76, 120, 160, 0.10);
    }

    /* FILTROS */

    .filtros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--azul-borde);
      border-radius: 10px;
      background: white;
      color: var(--texto);
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--azul);
    }

    /* FAVORITOS */

    .barra-favoritos {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #E7EEF3;
    }

    .favoritos-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .favoritos-titulo {
      font-size: 14px;
      font-weight: 700;
      color: var(--texto);
    }

    .contador-favoritos {
      font-size: 12px;
      color: var(--texto-suave);
    }

    .boton-favoritos {
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      padding: 10px 15px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .boton-favoritos:hover {
      background: var(--celeste);
    }

    .boton-favoritos.activo {
      background: var(--azul-oscuro);
      color: white;
      border-color: var(--azul-oscuro);
    }

    /* SELECCIÓN MÚLTIPLE */

    .barra-seleccion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding: 14px 15px;
      background: var(--celeste-claro);
      border: 1px solid var(--azul-borde);
      border-radius: 11px;
    }

    .seleccion-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .seleccion-titulo {
      font-size: 13px;
      font-weight: 700;
      color: var(--texto);
    }

    .contador-seleccion {
      font-size: 12px;
      color: var(--texto-suave);
    }

    .seleccion-acciones {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .boton-seleccion {
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .boton-seleccion:hover:not(:disabled) {
      border-color: var(--azul);
    }

    .boton-seleccion.principal {
      background: var(--azul-oscuro);
      color: white;
      border-color: var(--azul-oscuro);
    }

    .boton-seleccion.principal:hover:not(:disabled) {
      background: var(--azul);
    }

    .boton-seleccion:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* INFORMACIÓN */

    .info-resultados {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 22px 2px 15px;
      color: var(--texto-suave);
      font-size: 14px;
    }

    /* TARJETAS */

    .grid-preguntas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .tarjeta {
      position: relative;
      background: white;
      border: 1px solid #E2EBF1;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(47, 85, 115, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .tarjeta:hover {
      transform: translateY(-2px);
      box-shadow: var(--sombra);
    }

    .tarjeta.seleccionada {
      border-color: var(--azul-medio);
      box-shadow: 0 0 0 2px rgba(111, 163, 200, 0.12);
    }

    .seleccion-pregunta {
      margin-bottom: 12px;
    }

    .checkbox-pregunta {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--texto-suave);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-pregunta input {
      width: 16px;
      height: 16px;
      accent-color: var(--azul-oscuro);
      cursor: pointer;
    }

    .numero-pregunta {
      color: var(--azul);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .pregunta-texto {
      font-size: 16px;
      line-height: 1.55;
      margin: 0 42px 18px 0;
      color: var(--texto);
    }

    .estrella-tarjeta {
      position: absolute;
      right: 17px;
      top: 15px;
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      font-size: 23px;
      color: #AAB9C4;
      transition: 0.2s;
    }

    .estrella-tarjeta:hover {
      background: var(--celeste-claro);
      transform: scale(1.08);
    }

    .estrella-tarjeta.activa {
      color: #E3A72F;
    }

    .etiquetas {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 17px;
    }

    .etiqueta {
      background: var(--celeste);
      color: var(--azul-oscuro);
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 11px;
      line-height: 1.3;
    }

    .boton-ver {
      width: 100%;
      border: 0;
      background: var(--azul-oscuro);
      color: white;
      padding: 11px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
    }

    .boton-ver:hover {
      background: var(--azul);
    }

    /* PAGINACIÓN */

    .paginacion {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
    }

    .boton-pagina {
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .boton-pagina:hover:not(:disabled) {
      background: var(--celeste);
    }

    .boton-pagina:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pagina-info {
      font-size: 13px;
      color: var(--texto-suave);
      min-width: 150px;
      text-align: center;
    }

    /* ESTADO VACÍO */

    .sin-resultados {
      background: white;
      border: 1px solid #E2EBF1;
      border-radius: 15px;
      padding: 45px 25px;
      text-align: center;
      color: var(--texto-suave);
      grid-column: 1 / -1;
    }

    .sin-resultados-icono {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .sin-resultados h3 {
      color: var(--texto);
      margin: 0 0 8px;
      font-size: 18px;
    }

    .sin-resultados p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(22, 40, 53, 0.58);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.visible {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-contenido {
      position: relative;
      width: 100%;
      max-width: 650px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.20);
    }

    .cerrar-modal {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 38px;
      height: 38px;
      border: 0;
      background: var(--gris);
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      color: var(--texto);
    }

    .cerrar-modal:hover {
      background: var(--celeste);
    }

    .modal-numero {
      color: var(--azul);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .modal-pregunta {
      font-size: 21px;
      line-height: 1.5;
      color: var(--texto);
      margin: 0 45px 22px 0;
    }

    .modal-datos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .modal-acciones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .accion {
      flex: 1;
      min-width: 180px;
      padding: 12px 15px;
      border-radius: 9px;
      border: 1px solid var(--azul-borde);
      background: white;
      color: var(--azul-oscuro);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .accion:hover {
      background: var(--celeste-claro);
    }

    .accion-principal {
      background: var(--azul-oscuro);
      color: white;
      border-color: var(--azul-oscuro);
    }

    .accion-principal:hover {
      background: var(--azul);
    }

    .accion-favorito.activa {
      background: #FFF8E8;
      border-color: #E8C56B;
      color: #9A7119;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 20px;
      color: var(--texto-suave);
      font-size: 12px;
    }

    /* RESPONSIVE */

    @media (max-width: 800px) {

      .grid-preguntas {
        grid-template-columns: 1fr;
      }

      .filtros {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;
      }

    }

    @media (max-width: 500px) {

      header {
        padding: 32px 18px;
      }

      .contenedor {
        padding: 20px 14px 40px;
      }

      .modal-contenido {
        padding: 24px 20px;
      }

      .modal-pregunta {
        font-size: 18px;
      }

      .info-resultados {
        align-items: flex-start;
        flex-direction: column;
      }

      .barra-seleccion {
        align-items: flex-start;
      }

      .seleccion-acciones {
        width: 100%;
      }

      .boton-seleccion {
        flex: 1;
      }

    }

  </style>
</head>

<body>

  <header>

    <div class="header-inner">

      <div class="marca">
        TEMPLE · RECURSOS PARA TU PRÁCTICA
      </div>

      <h1>
        Banco de Preguntas Temple
      </h1>

      <p class="subtitulo">
        Explora y encuentra preguntas para tu práctica profesional.
      </p>

    </div>

  </header>


  <main class="contenedor">

    <section class="buscador">

      <input
        type="search"
        id="busqueda"
        class="input-busqueda"
        placeholder="🔎 Buscar una pregunta..."
        autocomplete="off"
      >

      <div class="filtros">

        <select id="filtroModulo">
          <option value="">Todos los módulos</option>
        </select>

        <select id="filtroEtapa">
          <option value="">Todas las etapas</option>
        </select>

        <select id="filtroSubtema">
          <option value="">Todos los subtemas</option>
        </select>

      </div>


      <div class="barra-favoritos">

        <div class="favoritos-info">

          <span class="favoritos-titulo">
            Mis favoritas
          </span>

          <span
            id="contadorFavoritos"
            class="contador-favoritos"
          >
            0 preguntas guardadas
          </span>

        </div>

        <button
          id="botonFavoritos"
          class="boton-favoritos"
          type="button"
        >
          ☆ Ver favoritas
        </button>

      </div>


      <div
        id="barraSeleccion"
        class="barra-seleccion"
      >

        <div class="seleccion-info">

          <span class="seleccion-titulo">
            Preguntas seleccionadas
          </span>

          <span
            id="contadorSeleccion"
            class="contador-seleccion"
          >
            0 preguntas seleccionadas
          </span>

        </div>

        <div class="seleccion-acciones">

          <button
            id="copiarSeleccionadas"
            class="boton-seleccion principal"
            type="button"
            disabled
          >
            📋 Copiar seleccionadas
          </button>

          <button
            id="limpiarSeleccion"
            class="boton-seleccion"
            type="button"
            disabled
          >
            Limpiar
          </button>

        </div>

      </div>

    </section>


    <div class="info-resultados">

      <span id="contadorResultados">
        0 preguntas
      </span>

      <span id="textoPagina"></span>

    </div>


    <section
      id="listaPreguntas"
      class="grid-preguntas"
    ></section>


    <div
      id="paginacion"
      class="paginacion"
    ></div>

  </main>


  <footer>
    Banco de Preguntas Temple · Recursos para la práctica profesional
  </footer>


  <!-- MODAL -->

  <div id="modal" class="modal">

    <div class="modal-contenido">

      <button
        id="cerrarModal"
        class="cerrar-modal"
        type="button"
        aria-label="Cerrar"
      >
        ×
      </button>

      <div
        id="modalNumero"
        class="modal-numero"
      ></div>

      <h2
        id="modalPregunta"
        class="modal-pregunta"
      ></h2>

      <div
        id="modalDatos"
        class="modal-datos"
      ></div>

      <div class="modal-acciones">

        <button
          id="modalFavorito"
          class="accion accion-favorito"
          type="button"
        >
          ☆ Agregar a favoritas
        </button>

        <button
          id="copiarPregunta"
          class="accion accion-principal"
          type="button"
        >
          📋 Copiar pregunta
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =====================================================
       DATOS
       ===================================================== */

    const preguntas = [];
const preguntasVistas = new Set();

function agregarPregunta(
  pregunta,
  modulo,
  etapa,
  subtema
) {
  const clave = pregunta.trim();

  // Omitir únicamente preguntas exactamente iguales
  if (preguntasVistas.has(clave)) return;

  preguntasVistas.add(clave);

  preguntas.push({
    id: preguntas.length + 1,
    pregunta: pregunta,
    modulo: modulo,
    etapa: etapa,
    subtema: subtema
  });
}

   agregarPregunta(
  "¿Qué consideras que ha sido lo más importante que has descubierto sobre ti durante este proceso?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué aprendizaje quieres conservar especialmente a partir de todo lo trabajado?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué ha cambiado en tu manera de comprender aquello que estabas viviendo al inicio?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué recurso personal reconoces ahora con mayor claridad?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué necesidad has aprendido a identificar con mayor facilidad?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué conducta o forma de responder te gustaría continuar modificando?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué cambio realizado hasta ahora valoras especialmente, aunque todavía esté en proceso?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué aspecto de tu experiencia todavía consideras necesario seguir explorando?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué has aprendido sobre aquello que puedes controlar y aquello que necesitas aceptar?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué decisión o prioridad actual refleja mejor lo que has aprendido sobre ti?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué recurso o estrategia quieres seguir utilizando en situaciones futuras?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué señales te ayudarán a reconocer cuándo necesitas volver a prestar atención a aquello que has trabajado?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué te gustaría hacer diferente si en el futuro vuelves a encontrarte ante una situación similar?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué parte del proceso consideras que todavía necesita tiempo, práctica o acompañamiento?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué quieres conservar de tu manera actual de afrontar las dificultades?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué quieres seguir construyendo a partir de lo que has aprendido?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "Si pudieras hablar con la versión de ti que estaba comenzando este proceso, ¿qué te gustaría que supiera ahora?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué decisión concreta puedes tomar para continuar cuidando aquello que has identificado como importante para ti?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué te gustaría recordar cuando atravieses nuevamente un momento de dificultad?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "Después de integrar todo lo trabajado, ¿qué te llevas de este proceso y hacia dónde quieres dirigir tus próximos pasos?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Cierre e integración"
);

agregarPregunta(
  "¿Qué necesitarías para mantener el cambio que estás comenzando a realizar?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Sostenimiento del cambio"
);

agregarPregunta(
  "¿Qué recursos podrían ayudarte cuando disminuya tu motivación?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Sostenimiento del cambio"
);

agregarPregunta(
  "¿Qué situaciones podrían aumentar el riesgo de volver a tu patrón anterior?",
  "Módulo 5 · Recursos cambio e integración",
  "Orientar",
  "Sostenimiento del cambio"

    function escaparHTML(texto) {

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function esFavorita(id) {

      return favoritos.includes(
        Number(id)
      );

    }


    function guardarFavoritos() {

      localStorage.setItem(
        "temple_favoritos",
        JSON.stringify(favoritos)
      );

    }


    /* =====================================================
       FAVORITOS
       ===================================================== */

    function actualizarContadorFavoritos() {

      const cantidad =
        favoritos.length;


      contadorFavoritos.textContent =
        cantidad === 0
          ? "Todavía no has guardado preguntas"
          : cantidad === 1
            ? "1 pregunta guardada"
            : `${cantidad} preguntas guardadas`;


      if (mostrarSoloFavoritas) {

        botonFavoritos.textContent =
          "← Ver todas";

      } else {

        botonFavoritos.textContent =
          cantidad > 0
            ? "★ Ver favoritas"
            : "☆ Ver favoritas";

      }


      botonFavoritos.classList.toggle(
        "activo",
        mostrarSoloFavoritas
      );

    }


    function cambiarFavorito(id) {

      id = Number(id);


      if (esFavorita(id)) {

        favoritos =
          favoritos.filter(
            favorito => favorito !== id
          );

      } else {

        favoritos.push(id);

      }


      guardarFavoritos();

      actualizarResultados(false);


      if (
        preguntaModalActual &&
        Number(preguntaModalActual.id) === id
      ) {

        actualizarModalFavorito();

      }

    }


    botonFavoritos.addEventListener(
      "click",
      function() {

        mostrarSoloFavoritas =
          !mostrarSoloFavoritas;

        paginaActual = 1;

        actualizarResultados(false);

      }
    );

       ===================================================== */

    function actualizarBarraSeleccion() {

      const cantidad =
        preguntasSeleccionadas.length;


      contadorSeleccion.textContent =
        cantidad === 0
          ? "0 preguntas seleccionadas"
          : cantidad === 1
            ? "1 pregunta seleccionada"
            : `${cantidad} preguntas seleccionadas`;


      copiarSeleccionadas.disabled =
        cantidad === 0;

      limpiarSeleccion.disabled =
        cantidad === 0;

    }


    function limpiarPreguntasSeleccionadas() {

      preguntasSeleccionadas = [];

      actualizarBarraSeleccion();

      renderizarPreguntas();

    }


    limpiarSeleccion.addEventListener(
      "click",
      function() {

        limpiarPreguntasSeleccionadas();

      }
    );


    copiarSeleccionadas.addEventListener(
      "click",
      async function() {

        if (
          preguntasSeleccionadas.length === 0
        ) {
          return;
        }


        const preguntasParaCopiar =
          preguntas
            .filter(
              p =>
                preguntasSeleccionadas.includes(
                  Number(p.id)
                )
            )
            .sort(
              (a, b) => a.id - b.id
            );


        const texto =
          preguntasParaCopiar
            .map(
              p =>
                `${p.id}. ${p.pregunta}`
            )
            .join("\n");


        try {

          await navigator.clipboard.writeText(
            texto
          );


          copiarSeleccionadas.textContent =
            "✓ Copiadas";


          setTimeout(
            () => {

              copiarSeleccionadas.textContent =
                "📋 Copiar seleccionadas";

            },
            1600
          );


        } catch (error) {

          const textarea =
            document.createElement("textarea");

          textarea.value = texto;

          document.body.appendChild(
            textarea
          );

          textarea.select();

          document.execCommand("copy");

          textarea.remove();


          copiarSeleccionadas.textContent =
            "✓ Copiadas";


          setTimeout(
            () => {

              copiarSeleccionadas.textContent =
                "📋 Copiar seleccionadas";

            },
            1600
          );

        }

      }
    );


    /* =====================================================
       FILTROS
       ===================================================== */

    function valoresUnicos(campo) {

      return [
        ...new Set(
          preguntas.map(
            p => p[campo]
          )
        )
      ].sort();

    }


    function llenarFiltro(
      select,
      valores,
      textoInicial
    ) {

      select.innerHTML =
        `<option value="">${textoInicial}</option>`;


      valores.forEach(
        valor => {

          const option =
            document.createElement(
              "option"
            );

          option.value = valor;

          option.textContent = valor;

          select.appendChild(
            option
          );

        }
      );

    }


    function prepararFiltros() {

      llenarFiltro(
        filtroModulo,
        valoresUnicos("modulo"),
        "Todos los módulos"
      );


      llenarFiltro(
        filtroEtapa,
        valoresUnicos("etapa"),
        "Todas las etapas"
      );


      llenarFiltro(
        filtroSubtema,
        valoresUnicos("subtema"),
        "Todos los subtemas"
      );

    }


    /* =====================================================
       FILTRADO
       ===================================================== */

    function obtenerResultados() {

      const texto =
        busqueda.value
          .trim()
          .toLowerCase();


      const modulo =
        filtroModulo.value;

      const etapa =
        filtroEtapa.value;

      const subtema =
        filtroSubtema.value;


      resultadosActuales =
        preguntas.filter(
          p => {

            const coincideTexto =
              !texto ||
              p.pregunta
                .toLowerCase()
                .includes(texto) ||
              p.modulo
                .toLowerCase()
                .includes(texto) ||
              p.etapa
                .toLowerCase()
                .includes(texto) ||
              p.subtema
                .toLowerCase()
                .includes(texto);


            const coincideModulo =
              !modulo ||
              p.modulo === modulo;


            const coincideEtapa =
              !etapa ||
              p.etapa === etapa;


            const coincideSubtema =
              !subtema ||
              p.subtema === subtema;


            const coincideFavorito =
              !mostrarSoloFavoritas ||
              esFavorita(p.id);


            return (
              coincideTexto &&
              coincideModulo &&
              coincideEtapa &&
              coincideSubtema &&
              coincideFavorito
            );

          }
        );

    }


    function actualizarResultados(
      resetearPagina = true
    ) {

      obtenerResultados();


      if (resetearPagina) {

        paginaActual = 1;

      }


      const totalPaginas =
        Math.max(
          1,
          Math.ceil(
            resultadosActuales.length /
            preguntasPorPagina
          )
        );


      if (
        paginaActual >
        totalPaginas
      ) {

        paginaActual =
          totalPaginas;

      }


      renderizarPreguntas();

      renderizarPaginacion();

      actualizarContadorFavoritos();

      actualizarBarraSeleccion();

    }


    /* =====================================================
       PREGUNTAS
       ===================================================== */

    function renderizarPreguntas() {

      listaPreguntas.innerHTML = "";


      const inicio =
        (paginaActual - 1) *
        preguntasPorPagina;


      const fin =
        inicio +
        preguntasPorPagina;


      const pagina =
        resultadosActuales.slice(
          inicio,
          fin
        );


      contadorResultados.textContent =
        resultadosActuales.length === 1
          ? "1 pregunta"
          : `${resultadosActuales.length} preguntas`;


      if (
        resultadosActuales.length === 0
      ) {

        textoPagina.textContent = "";


        listaPreguntas.innerHTML = `

          <div class="sin-resultados">

            <div class="sin-resultados-icono">
              🔎
            </div>

            <h3>
              No encontramos preguntas
            </h3>

            <p>
              Prueba modificando la búsqueda
              o alguno de los filtros.
            </p>

          </div>

        `;


        return;

      }


      const totalPaginas =
        Math.ceil(
          resultadosActuales.length /
          preguntasPorPagina
        );


      textoPagina.textContent =
        `Página ${paginaActual} de ${totalPaginas}`;


      pagina.forEach(
        p => {

          const favorita =
            esFavorita(p.id);


          const seleccionada =
            preguntasSeleccionadas.includes(
              p.id
            );


          const tarjeta =
            document.createElement(
              "article"
            );


          tarjeta.className =
            `tarjeta ${
              seleccionada
                ? "seleccionada"
                : ""
            }`;


          tarjeta.innerHTML = `

            <div class="seleccion-pregunta">

              <label class="checkbox-pregunta">

                <input
                  type="checkbox"
                  class="checkbox-seleccion"
                  data-id="${p.id}"
                  ${
                    seleccionada
                      ? "checked"
                      : ""
                  }
                >

                <span>
                  Seleccionar
                </span>

              </label>

            </div>


            <button
              class="estrella-tarjeta ${
                favorita
                  ? "activa"
                  : ""
              }"
              type="button"
              aria-label="${
                favorita
                  ? "Quitar de favoritas"
                  : "Agregar a favoritas"
              }"
              title="${
                favorita
                  ? "Quitar de favoritas"
                  : "Agregar a favoritas"
              }"
              data-id="${p.id}"
            >
              ${
                favorita
                  ? "★"
                  : "☆"
              }
            </button>


            <div class="numero-pregunta">
              PREGUNTA ${p.id}
            </div>


            <p class="pregunta-texto">
              ${escaparHTML(
                p.pregunta
              )}
            </p>


            <div class="etiquetas">

              <span class="etiqueta">
                ${escaparHTML(
                  p.modulo
                )}
              </span>

              <span class="etiqueta">
                ${escaparHTML(
                  p.etapa
                )}
              </span>

              <span class="etiqueta">
                ${escaparHTML(
                  p.subtema
                )}
              </span>

            </div>


            <button
              class="boton-ver"
              type="button"
              data-id="${p.id}"
            >
              Ver pregunta
            </button>

          `;


          listaPreguntas.appendChild(
            tarjeta
          );

        }
      );


      document
        .querySelectorAll(
          ".checkbox-seleccion"
        )
        .forEach(
          checkbox => {

            checkbox.addEventListener(
              "change",
              function() {

                const id =
                  Number(
                    this.dataset.id
                  );


                if (this.checked) {

                  if (
                    !preguntasSeleccionadas.includes(
                      id
                    )
                  ) {

                    preguntasSeleccionadas.push(
                      id
                    );

                  }

                } else {

                  preguntasSeleccionadas =
                    preguntasSeleccionadas.filter(
                      preguntaId =>
                        preguntaId !== id
                    );

                }


                actualizarBarraSeleccion();

                renderizarPreguntas();

              }
            );

          }
        );


      document
        .querySelectorAll(
          ".estrella-tarjeta"
        )
        .forEach(
          btn => {

            btn.addEventListener(
              "click",
              function(event) {

                event.stopPropagation();

                cambiarFavorito(
                  Number(
                    this.dataset.id
                  )
                );

              }
            );

          }
        );


      document
        .querySelectorAll(
          ".boton-ver"
        )
        .forEach(
          btn => {

            btn.addEventListener(
              "click",
              function() {

                abrirModal(
                  Number(
                    this.dataset.id
                  )
                );

              }
            );

          }
        );

    }


    /* =====================================================
       MODAL
       ===================================================== */

    function abrirModal(id) {

      const pregunta =
        preguntas.find(
          p =>
            Number(p.id) ===
            Number(id)
        );


      if (!pregunta) {
        return;
      }


      preguntaModalActual =
        pregunta;


      modalNumero.textContent =
        `PREGUNTA ${pregunta.id}`;


      modalPregunta.textContent =
        pregunta.pregunta;


      modalDatos.innerHTML = `

        <span class="etiqueta">
          ${escaparHTML(
            pregunta.modulo
          )}
        </span>

        <span class="etiqueta">
          ${escaparHTML(
            pregunta.etapa
          )}
        </span>

        <span class="etiqueta">
          ${escaparHTML(
            pregunta.subtema
          )}
        </span>

      `;


      actualizarModalFavorito();


      copiarPregunta.textContent =
        "📋 Copiar pregunta";


      modal.classList.add(
        "visible"
      );


      document.body.style.overflow =
        "hidden";

    }


    function actualizarModalFavorito() {

      if (
        !preguntaModalActual
      ) {
        return;
      }


      const favorita =
        esFavorita(
          preguntaModalActual.id
        );


      if (favorita) {

        modalFavorito.textContent =
          "★ Quitar de favoritas";

      } else {

        modalFavorito.textContent =
          "☆ Agregar a favoritas";

      }


      modalFavorito.classList.toggle(
        "activa",
        favorita
      );

    }


    function cerrarElModal() {

      modal.classList.remove(
        "visible"
      );


      document.body.style.overflow =
        "";


      preguntaModalActual =
        null;

    }


    cerrarModal.addEventListener(
      "click",
      cerrarElModal
    );


    modal.addEventListener(
      "click",
      function(event) {

        if (
          event.target === modal
        ) {

          cerrarElModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          modal.classList.contains(
            "visible"
          )
        ) {

          cerrarElModal();

        }

      }
    );


    modalFavorito.addEventListener(
      "click",
      function() {

        if (
          !preguntaModalActual
        ) {
          return;
        }


        cambiarFavorito(
          preguntaModalActual.id
        );

      }
    );


    /* =====================================================
       COPIAR UNA PREGUNTA
       ===================================================== */

    copiarPregunta.addEventListener(
      "click",
      async function() {

        if (
          !preguntaModalActual
        ) {
          return;
        }


        const texto =
          preguntaModalActual.pregunta;


        try {

          await navigator.clipboard.writeText(
            texto
          );


          copiarPregunta.textContent =
            "✓ Copiada";


          setTimeout(
            () => {

              if (
                modal.classList.contains(
                  "visible"
                )
              ) {

                copiarPregunta.textContent =
                  "📋 Copiar pregunta";

              }

            },
            1600
          );


        } catch (error) {

          const textarea =
            document.createElement(
              "textarea"
            );


          textarea.value =
            texto;


          document.body.appendChild(
            textarea
          );


          textarea.select();

          document.execCommand(
            "copy"
          );


          textarea.remove();


          copiarPregunta.textContent =
            "✓ Copiada";


          setTimeout(
            () => {

              if (
                modal.classList.contains(
                  "visible"
                )
              ) {

                copiarPregunta.textContent =
                  "📋 Copiar pregunta";

              }

            },
            1600
          );

        }

      }
    );


    /* =====================================================
       PAGINACIÓN
       ===================================================== */

    function renderizarPaginacion() {

      paginacion.innerHTML = "";


      if (
        resultadosActuales.length === 0
      ) {
        return;
      }


      const totalPaginas =
        Math.ceil(
          resultadosActuales.length /
          preguntasPorPagina
        );


      if (
        totalPaginas <= 1
      ) {
        return;
      }


      const anterior =
        document.createElement(
          "button"
        );


      anterior.className =
        "boton-pagina";


      anterior.textContent =
        "← Anterior";


      anterior.disabled =
        paginaActual === 1;


      anterior.addEventListener(
        "click",
        function() {

          if (
            paginaActual > 1
          ) {

            paginaActual--;


            renderizarPreguntas();

            renderizarPaginacion();


            document
              .getElementById(
                "listaPreguntas"
              )
              .scrollIntoView({

                behavior: "smooth",

                block: "start"

              });

          }

        }
      );


      const paginaInfo =
        document.createElement(
          "span"
        );


      paginaInfo.className =
        "pagina-info";


      const inicio =
        (paginaActual - 1) *
        preguntasPorPagina + 1;


      const fin =
        Math.min(
          paginaActual *
            preguntasPorPagina,
          resultadosActuales.length
        );


      paginaInfo.textContent =
        `Preguntas ${inicio}–${fin} de ${resultadosActuales.length}`;


      const siguiente =
        document.createElement(
          "button"
        );


      siguiente.className =
        "boton-pagina";


      siguiente.textContent =
        "Siguiente →";


      siguiente.disabled =
        paginaActual === totalPaginas;


      siguiente.addEventListener(
        "click",
        function() {

          if (
            paginaActual <
            totalPaginas
          ) {

            paginaActual++;


            renderizarPreguntas();

            renderizarPaginacion();


            document
              .getElementById(
                "listaPreguntas"
              )
              .scrollIntoView({

                behavior: "smooth",

                block: "start"

              });

          }

        }
      );


      paginacion.appendChild(
        anterior
      );

      paginacion.appendChild(
        paginaInfo
      );

      paginacion.appendChild(
        siguiente
      );

    }


    /* =====================================================
       EVENTOS DE FILTROS
       ===================================================== */

    busqueda.addEventListener(
      "input",
      function() {

        actualizarResultados(true);

      }
    );


    filtroModulo.addEventListener(
      "change",
      function() {

        actualizarResultados(true);

      }
    );


    filtroEtapa.addEventListener(
      "change",
      function() {

        actualizarResultados(true);

      }
    );


    filtroSubtema.addEventListener(
      "change",
      function() {

        actualizarResultados(true);

      }
    );


    /* =====================================================
       INICIO
       ===================================================== */

    prepararFiltros();

    actualizarContadorFavoritos();

    actualizarBarraSeleccion();

    actualizarResultados(true);

  </script>

</body>
</html>
